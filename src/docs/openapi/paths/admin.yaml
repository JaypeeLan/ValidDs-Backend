health:
  get:
    summary: Server Health
    description: Returns server metrics such as memory, CPU, DB connectivity, and job statuses.
    tags:
      - Admin
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  example:
                    system:
                      uptimeSeconds: 1515
                      osUptimeSeconds: 147585
                      memory:
                        rssMb: 110
                        heapTotalMb: 60
                        heapUsedMb: 50
                      cpuLoadAvg: [1.2, 1.0, 0.9]
                    database:
                      mongoStatus: 'connected'
                      redisStatus: 'connected'
                      redisLatencyMs: 2
                    jobs:
                      enabled: false
                      timers:
                        staleCleanup: false
                        productIngestion: false
                        creativeIngestion: false
                        liveMonitorDiscover: false
                      outcomes:
                        productRefresh:
                          running: false
                          lastError: null
      '401':
        $ref: '../components/responses/Standard.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../components/responses/Standard.yaml#/ForbiddenResponse'

analyticsUsers:
  get:
    summary: User Analytics
    description: Returns breakdown of users by plan and status, plus daily acquisition counts.
    tags:
      - Admin
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  example:
                    totalUsers: 154
                    newUsersToday: 12
                    usersByPlan:
                      free: 100
                      explorer: 20
                      pro: 30
                      premium: 4
                    usersByStatus:
                      active: 140
                      suspended: 14

analyticsProducts:
  get:
    summary: Product Analytics
    description: Returns overview of the product ingestion pipeline and category breakdown. Optionally filtered to a single market.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: query
        name: market
        required: false
        schema:
          $ref: '../components/schemas/Admin.yaml#/MarketCode'
        description: Filter analytics to a specific market. Omit to aggregate all markets.
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    markets:
                      type: array
                      items:
                        $ref: '../components/schemas/Admin.yaml#/MarketCode'
                    totalProducts:
                      type: integer
                    freshProducts24h:
                      type: integer
                    productsBySource:
                      type: object
                      additionalProperties:
                        type: integer
                    topCategories:
                      type: object
                      additionalProperties:
                        type: integer
                  example:
                    markets: [US, CA, MX, UK, AU, NZ, ES, DE, FR, IT]
                    totalProducts: 1205
                    freshProducts24h: 305
                    productsBySource:
                      admin: 12
                      scarper: 1000
                    topCategories:
                      'Home & Kitchen': 400
                      'Beauty & Personal Care': 350

analyticsCreatives:
  get:
    summary: Creative Analytics
    description: |
      Returns TikTok creative (video) inventory: document counts, total video slots (primary + related),
      ingestion in the last 24h, breakdown by feed section, ads vs organic, and top L1 categories.
      Optionally filtered to a single market.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: query
        name: market
        required: false
        schema:
          $ref: '../components/schemas/Admin.yaml#/MarketCode'
        description: Filter analytics to a specific market. Omit to aggregate all markets.
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    markets:
                      type: array
                      items:
                        $ref: '../components/schemas/Admin.yaml#/MarketCode'
                    totalCreatives:
                      type: integer
                      description: Number of creative documents in MongoDB
                    totalVideos:
                      type: integer
                      description: Sum of primary videos plus all relatedVideos per document
                    freshCreatives24h:
                      type: integer
                      description: Creative documents ingested in the last 24 hours (ingestedAt)
                    creativesBySection:
                      type: object
                      additionalProperties:
                        type: integer
                      example:
                        trending: 120
                        top-ads: 45
                    creativesByAdType:
                      type: object
                      properties:
                        ads:
                          type: integer
                        organic:
                          type: integer
                    topCategories:
                      type: object
                      additionalProperties:
                        type: integer
                      description: Top 10 by categoryL1 (mirrors product taxonomy when set)
                  example:
                    markets: [US, CA, MX, UK, AU, NZ, ES, DE, FR, IT]
                    totalCreatives: 800
                    totalVideos: 2100
                    freshCreatives24h: 40
                    creativesBySection:
                      trending: 300
                      top-ads: 500
                    creativesByAdType:
                      ads: 200
                      organic: 600
                    topCategories:
                      'Home & Kitchen': 250
                      'Beauty & Personal Care': 180

users:
  get:
    summary: List Users
    description: Returns a paginated list of users with filtering options.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
      - in: query
        name: status
        schema:
          type: string
          enum: [active, suspended, deleted]
      - in: query
        name: plan
        schema:
          type: string
          enum: [free, explorer, pro, premium]
      - in: query
        name: role
        schema:
          type: string
          enum: [user, admin, super_admin]
        description: Filter by user role
      - in: query
        name: q
        schema:
          type: string
        description: Search by name or email
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    users:
                      type: array
                      items:
                        $ref: '../components/schemas/User.yaml'
                    pagination:
                      $ref: '../components/schemas/Common.yaml#/Pagination'

userDelete:
  delete:
    summary: Delete User
    description: Permanently deletes a user account (hard delete). Admins cannot delete their own account.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    responses:
      '200':
        description: User deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Common.yaml#/SuccessResponse'

userStatusUpdate:
  patch:
    summary: Update User Status
    description: Update user account status (active | suspended).
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: [active, suspended]
    responses:
      '200':
        description: User status updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Common.yaml#/SuccessResponse'

products:
  get:
    summary: List Products
    description: Returns a paginated list of products for a given market with filtering options.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: query
        name: market
        required: true
        schema:
          $ref: '../components/schemas/Admin.yaml#/MarketCode'
        description: Market collection to query (e.g. `products_us`)
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
      - in: query
        name: status
        schema:
          type: string
          enum: [active, archived, stale]
        description: |
          Filter by catalog `status`. Accepts `active`, `archived`, or `stale`.
          Products may also have `review` or `invalid` (not filterable via this param).
      - in: query
        name: source
        schema:
          type: string
        description: Filter by ingestion source
      - in: query
        name: category
        schema:
          type: string
        description: Filter by categoryL1
      - in: query
        name: q
        schema:
          type: string
        description: Search by title or description
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    market:
                      $ref: '../components/schemas/Admin.yaml#/MarketCode'
                    products:
                      type: array
                      items:
                        $ref: '../components/schemas/Product.yaml'
                    pagination:
                      $ref: '../components/schemas/Common.yaml#/Pagination'

  post:
    summary: Create Product
    description: |
      Manually add a product to a market collection (`products_<market>`). Status is always set to `review`
      with `validationStatus: pending` on create.
    tags:
      - Admin
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [market, title, categoryL1, externalId]
            properties:
              market:
                $ref: '../components/schemas/Admin.yaml#/MarketCode'
              title:
                type: string
                minLength: 1
                maxLength: 120
              categoryL1:
                type: string
                minLength: 1
              categoryL2:
                type: string
              externalId:
                type: string
                minLength: 1
                description: External product identifier (TikTok shop, manual SKU, etc.)
              description:
                type: string
                maxLength: 2000
              price:
                type: number
                minimum: 0
              currency:
                type: string
                minLength: 3
                maxLength: 3
                default: USD
              productUrl:
                type: string
                format: uri
              shopName:
                type: string
              primaryImageUrl:
                type: string
                format: uri
              source:
                type: string
                minLength: 1
                default: admin
                description: Ingestion source label stored on the document
    responses:
      '201':
        description: Product created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    market:
                      $ref: '../components/schemas/Admin.yaml#/MarketCode'
                    product:
                      $ref: '../components/schemas/Product.yaml'

productDelete:
  delete:
    summary: Delete Product
    description: Permanently delete a product from a specific market collection.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: MongoDB ObjectId of the product
      - in: query
        name: market
        required: true
        schema:
          $ref: '../components/schemas/Admin.yaml#/MarketCode'
        description: Market collection the product belongs to
    responses:
      '200':
        description: Product deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Common.yaml#/SuccessResponse'

creatives:
  post:
    summary: Create Creative
    description: Manually add a TikTok creative video to a market collection.
    tags:
      - Admin
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [market, externalVideoId]
            properties:
              market:
                $ref: '../components/schemas/Admin.yaml#/MarketCode'
              externalVideoId:
                type: string
                minLength: 1
                description: TikTok video ID
              productId:
                type: string
                pattern: '^[0-9a-fA-F]{24}$'
                description: Optional MongoDB ObjectId of linked product in the same market
              videoPlayUrl:
                type: string
                format: uri
              thumbnailUrl:
                type: string
                format: uri
              isAd:
                type: boolean
                default: false
              section:
                $ref: '../components/schemas/Admin.yaml#/AdminCreativeSection'
              creatorHandle:
                type: string
                description: Stored on `creator.handle` when provided
              description:
                type: string
                maxLength: 2000
    responses:
      '201':
        description: Creative created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    market:
                      $ref: '../components/schemas/Admin.yaml#/MarketCode'
                    creative:
                      $ref: '../components/schemas/Creative.yaml'

creativeDelete:
  delete:
    summary: Delete Creative
    description: Permanently delete a creative from a specific market collection.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: MongoDB ObjectId of the creative
      - in: query
        name: market
        required: true
        schema:
          $ref: '../components/schemas/Admin.yaml#/MarketCode'
        description: Market collection the creative belongs to
    responses:
      '200':
        description: Creative deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Common.yaml#/SuccessResponse'

transactions:
  get:
    summary: List Transactions
    description: List all transaction records.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
      - in: query
        name: status
        schema:
          type: string
          enum: [pending, paid, failed, refunded]
      - in: query
        name: mode
        schema:
          type: string
          enum: [test, live]
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    transactions:
                      type: array
                      items:
                        type: object
                    pagination:
                      $ref: '../components/schemas/Common.yaml#/Pagination'

  post:
    summary: Create Transaction
    description: Store a newly created transaction record.
    tags:
      - Admin
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - userId
              - amount
            properties:
              userId:
                type: string
              userEmail:
                type: string
              amount:
                type: number
              currency:
                type: string
                default: 'USD'
              status:
                type: string
                enum: [pending, paid, failed, refunded]
                default: 'pending'
              mode:
                type: string
                enum: [test, live]
                default: 'test'
              provider:
                type: string
                default: 'stripe'
              reference:
                type: string
              stripePaymentIntentId:
                type: string
              stripeCustomerId:
                type: string
              metadata:
                type: object
                additionalProperties:
                  type: string
    responses:
      '201':
        description: Transaction created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    transaction:
                      type: object

waitlist:
  get:
    summary: List waitlist entries
    description: |
      Returns a paginated list of waitlist email signups, newest first, along
      with high-level stats (total, last 7 days, last 24 hours). Admin only.
    tags:
      - Admin
    security:
      - BearerAuth: []
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1, minimum: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      - in: query
        name: q
        description: Case-insensitive substring match on the email.
        schema: { type: string }
      - in: query
        name: source
        description: Filter by exact attribution source (e.g. `landing-hero`).
        schema: { type: string, maxLength: 64 }
      - in: query
        name: from
        description: Inclusive lower bound on `createdAt` (ISO-8601).
        schema: { type: string, format: date-time }
      - in: query
        name: to
        description: Inclusive upper bound on `createdAt` (ISO-8601).
        schema: { type: string, format: date-time }
    responses:
      '200':
        description: Waitlist page retrieved successfully.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        entries:
                          type: array
                          items:
                            type: object
                            properties:
                              _id: { type: string }
                              email: { type: string, format: email }
                              source: { type: string, nullable: true }
                              referrer: { type: string, nullable: true }
                              ipAddress: { type: string, nullable: true }
                              userAgent: { type: string, nullable: true }
                              createdAt: { type: string, format: date-time }
                              updatedAt: { type: string, format: date-time }
                        pagination:
                          $ref: '../components/schemas/Common.yaml#/Pagination'
                        stats:
                          type: object
                          properties:
                            total: { type: integer, example: 1248 }
                            last7Days: { type: integer, example: 137 }
                            last24Hours: { type: integer, example: 21 }
      '401':
        $ref: '../components/responses/Standard.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../components/responses/Standard.yaml#/ForbiddenResponse'
