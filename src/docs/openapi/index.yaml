openapi: 3.0.3
info:
  title: ValidDs Backend API
  description: |
    API documentation for ValidDs — TikTok product research and validation platform.
    
    All endpoints are prefixed with `/api/v1` except for health checks.
    
    ### Authentication
    - **API Key**: Required for internal/service-to-service communication.
    - **JWT**: Required for account-specific routes (auth, profile, saved products, **stores/Shopify**, ingestion). Product and creative **list/detail/search** are public unless noted on the operation.
    
    **Admin** (`/api/v1/admin/*`) OpenAPI is published separately at **`/admin-docs`** (see `admin-docs/openapi/` in the repo).
  version: 1.0.0
  contact:
    name: ValidDs Support
    url: https://validds.com/support

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://validds-backend-g196.onrender.com
    description: Staging environment

tags:
  - name: Health
    description: System status and uptime checks
  - name: Auth
    description: User registration, login, email verification, and session management
  - name: Products
    description: Product list (paginated, optional search and filters) and product details
  - name: Profile
    description: User settings and account management
  - name: Ingestion
    description: Background ingestion controls.
  - name: Billing
    description: Stripe billing — public plan catalog, Checkout session creation, subscription state, and publishable key
  - name: Waitlist
    description: Pre-launch email waitlist — public `POST /api/v1/waitlist` to join; admin listing is documented under **`/admin-docs`**.
  - name: Stores
    description: Shopify OAuth — connect a merchant store and push ValidDs products via Admin REST
  - name: TikTok Live
    description: Live session data from MongoDB (`GET /tiktok/live/discover`); reconcile stale sessions with `POST /tiktok/live/reconcile`; add handles with `POST /tiktok/live/watchlist`; hourly job syncs from ScrapeCreators
  - name: TikTok Live (Admin)
    description: Admin-only — manage the tracked store watchlist, run ad-hoc live checks, view session GMV history

