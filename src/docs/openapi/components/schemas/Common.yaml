SuccessResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: Operation successful
    statusCode:
      type: integer
      example: 200
    data:
      type: object

ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: Resource not found
    statusCode:
      type: integer
      example: 404
    error:
      type: object
      properties:
        code:
          type: string
          example: NOT_FOUND
        details:
          type: object
    requestId:
      type: string
      example: req_123456789

UnauthorizedError:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: Unauthorized
    statusCode:
      type: integer
      example: 401
    error:
      type: object
      properties:
        code:
          type: string
          example: UNAUTHORIZED
    requestId:
      type: string
      example: req_123456789

Pagination:
  type: object
  properties:
    page:
      type: integer
      example: 1
    limit:
      type: integer
      example: 20
    total:
      type: integer
      example: 100
    totalPages:
      type: integer
      example: 5
