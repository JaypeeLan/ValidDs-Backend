openapi: 3.0.3
info:
  title: ValidDs Admin API
  description: |
    OpenAPI for **`/api/v1/admin/*`**. All operations require **JWT** with **admin** role.

    **Multi-market:** Product and creative content is scoped by `market` (US, UK, …). List/delete use `?market=`; create passes `market` in the JSON body. Analytics accept optional `?market=` or aggregate all regions when omitted.

    Markdown reference: **`admin-docs/endpoints.md`**. Interactive UI: **`/admin-docs`**.

    Includes **`/api/v1/admin/*`**, internal **`/jobs/*`** (API key), **`POST /ingestion/trigger`**, and TikTok operator routes (admin JWT).
  version: 1.0.0
  contact:
    name: ValidDs Support
    url: https://validds.com/support

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://validds-backend-g196.onrender.com
    description: Staging environment

x-tagGroups:
  - name: Platform admin
    tags: [Admin]
  - name: Operations
    tags: [Jobs, Ingestion, TikTok Live (Admin)]

tags:
  - name: Admin
    description: System health, analytics, user/product management, transactions, waitlist listing.
  - name: Jobs
    description: Background job triggers and status — requires **`X-API-Key`** (`INTERNAL_API_KEY`)
  - name: Ingestion
    description: Manual ingestion trigger (currently disabled)
  - name: TikTok Live (Admin)
    description: Ad-hoc live checks, live room product shelf, session GMV history — requires admin JWT

paths:
  /api/v1/admin/health:
    $ref: ./paths/admin.yaml#/health
  /api/v1/admin/analytics/users:
    $ref: ./paths/admin.yaml#/analyticsUsers
  /api/v1/admin/analytics/products:
    $ref: ./paths/admin.yaml#/analyticsProducts
  /api/v1/admin/analytics/creatives:
    $ref: ./paths/admin.yaml#/analyticsCreatives
  /api/v1/admin/users:
    $ref: ./paths/admin.yaml#/users
  /api/v1/admin/users/{userId}:
    $ref: ./paths/admin.yaml#/userDelete
  /api/v1/admin/users/{userId}/status:
    $ref: ./paths/admin.yaml#/userStatusUpdate
  /api/v1/admin/products:
    $ref: ./paths/admin.yaml#/products
  /api/v1/admin/products/{id}:
    $ref: ./paths/admin.yaml#/productDelete
  /api/v1/admin/creatives:
    $ref: ./paths/admin.yaml#/creatives
  /api/v1/admin/creatives/{id}:
    $ref: ./paths/admin.yaml#/creativeDelete
  /api/v1/admin/transactions:
    $ref: ./paths/admin.yaml#/transactions
  /api/v1/admin/waitlist:
    $ref: ./paths/admin.yaml#/waitlist
  /api/v1/ingestion/trigger:
    $ref: ./paths/ingestion.yaml#/trigger
  /api/v1/jobs/status:
    $ref: ./paths/jobs.yaml#/status
  /api/v1/jobs/product-refresh:
    $ref: ./paths/jobs.yaml#/productRefresh
  /api/v1/jobs/product-ingestion:
    $ref: ./paths/jobs.yaml#/productIngestion
  /api/v1/jobs/creative-ingestion:
    $ref: ./paths/jobs.yaml#/creativeIngestion
  /api/v1/jobs/stale-cleanup:
    $ref: ./paths/jobs.yaml#/staleCleanup
  /api/v1/jobs/live-monitor-discover:
    $ref: ./paths/jobs.yaml#/liveMonitorDiscover
  /api/v1/tiktok/live:
    $ref: ./paths/tiktok.yaml#/liveSingle
  /api/v1/tiktok/live/batch:
    $ref: ./paths/tiktok.yaml#/liveBatch
  /api/v1/tiktok/live/products:
    $ref: ./paths/tiktok.yaml#/liveProducts
  /api/v1/tiktok/sessions:
    $ref: ./paths/tiktok.yaml#/sessions
  /api/v1/tiktok/sessions/{id}:
    $ref: ./paths/tiktok.yaml#/sessionItem

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      $ref: ./components/schemas/Common.yaml#/SuccessResponse
    ErrorResponse:
      $ref: ./components/schemas/Common.yaml#/ErrorResponse
    User:
      $ref: ./components/schemas/User.yaml
    Product:
      $ref: ./components/schemas/Product.yaml
    Creative:
      $ref: ./components/schemas/Creative.yaml
    MarketCode:
      $ref: ./components/schemas/Admin.yaml#/MarketCode
    AdminCreativeSection:
      $ref: ./components/schemas/Admin.yaml#/AdminCreativeSection
