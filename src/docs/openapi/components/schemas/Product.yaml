type: object
required:
  - id
  - externalId
  - source
  - status
  - title
  - normalizedTitle
  - categoryL1
  - categoryPath
  - aiInsight
  - trend
properties:
  id:
    type: string
    example: 60b9b3b3e2b4f9a0c8b2c1d4

  externalId:
    type: string
    description: Source-specific external identifier.
  source:
    type: string
    description: Ingestion pipeline source.
    example: tiktok
  status:
    type: string
    enum: [active, review, invalid, stale, archived]
    description: |
      Catalog lifecycle. Schema enum (default `review`): `active` = live in feed;
      `review` = pending QA; `invalid` = rejected.
      Operational: `stale` (stale-cleanup job when re-ingest stops);
      `archived` (manually hidden). Feed excludes `archived` and `invalid`.

  title:
    type: string
    maxLength: 120
  normalizedTitle:
    type: string
  description:
    type: string
    maxLength: 2000
  hashtags:
    type: array
    items:
      type: string

  categoryL1:
    type: string
    example: 'Beauty & Personal Care'
  categoryL2:
    type: string
    example: 'Skincare'
  categoryL3:
    type: string
    example: 'Face Serums'
  categoryPath:
    type: string
    example: 'Beauty & Personal Care > Skincare > Face Serums'

  primaryImageUrl:
    type: string
    format: uri
  imageUrls:
    type: array
    items:
      type: string
      format: uri

  price:
    type: number
    minimum: 0
    example: 24.99
  originalPrice:
    type: number
    nullable: true
    minimum: 0
    description: Strikethrough / was price on TikTok Shop when higher than `price`.
  currency:
    type: string
    example: USD

  suppliers:
    type: array
    description: Marketplace / supplier listings found for this product.
    items:
      type: object
      properties:
        source:
          type: string
          example: amazon
        platform:
          type: string
          description: Marketplace label; omitted on Shopify App rows (use `source`).
          example: Amazon
        onSale:
          type: boolean
        soldLast30Days:
          type: integer
          nullable: true
        externalId:
          type: string
        title:
          type: string
        productUrl:
          type: string
          format: uri
        shareUrl:
          type: string
          format: uri
        price:
          type: number
          nullable: true
        currency:
          type: string
        rating:
          type: number
          nullable: true
        totalRatings:
          type: integer
          nullable: true
        totalReviews:
          type: integer
          nullable: true
        availableForSale:
          type: boolean
        moq:
          type: integer
          description: Minimum order quantity.
        shop:
          type: object
          nullable: true
          properties:
            name: { type: string }
            url: { type: string, format: uri }
            rating: { type: number, nullable: true }
        monthlyTraffic:
          type: integer
          nullable: true
        productUnitsSold:
          type: integer
          minimum: 1
          nullable: false
        estimatedMonthlyRevenue:
          type: number
          nullable: true
        revenueSource:
          type: string
          enum: [product-sales, traffic-estimate]
          nullable: true
        competitorScore:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        checkedAt:
          type: string
          format: date-time
          nullable: true
        fetchedAt:
          type: string
          format: date-time

  rating:
    type: number
    minimum: 0
    maximum: 5
    description: Weighted average rating derived from all rating sources (1–5).
  reviewCount:
    type: integer
    description: Total review count across all sources.

  ratingSources:
    type: array
    description: Per-platform rating breakdown used to derive the weighted average.
    items:
      type: object
      properties:
        platform: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        sourceUrl: { type: string, format: uri }
        fetchedAt: { type: string, format: date-time }

  reviews:
    type: array
    description: Review snippets from ingestion sources.
    items:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: TikTok Shop reviewer display name.
        author:
          type: string
          nullable: true
          description: Legacy / AI extraction author.
        rating: { type: number, nullable: true }
        review:
          type: string
          nullable: true
          description: TikTok Shop review body.
        content:
          type: string
          nullable: true
          description: Legacy / AI extraction body.
        date: { type: string, nullable: true }
        item: { type: string, nullable: true }
        images:
          type: array
          items: { type: string, format: uri }

  soldCount:
    type: integer
    minimum: 0
    description: Lifetime sold count (from TikTok Shop scraper where available).
  totalSales:
    type: number
    minimum: 0
  totalGmv:
    type: number
    minimum: 0
    description: Total gross merchandise value (GMV).

  salesHistory:
    type: array
    description: Snapshots of `totalSales` over time (detail responses).
    items:
      $ref: ./MetricTrend.yaml#/SalesHistoryEntry

  salesTrend:
    allOf:
      - $ref: ./MetricTrend.yaml#/MetricTrend
    nullable: true
    description: Windowed view of unit sales (`windows[].value` = units).

  revenueHistory:
    type: array
    description: Snapshots of `totalGmv` over time (detail responses).
    items:
      $ref: ./MetricTrend.yaml#/RevenueHistoryEntry

  revenueTrend:
    allOf:
      - $ref: ./MetricTrend.yaml#/MetricTrend
    nullable: true
    description: Windowed view of GMV (`windows[].value` = revenue).

  viewCount:
    type: integer
    description: Views on the discovery post.
  likeCount:
    type: integer
  commentCount:
    type: integer
  shareCount:
    type: integer
  engagementRate:
    type: number
    nullable: true

  primaryCreator:
    type: object
    description: TikTok creator who posted the discovery video.
    properties:
      tiktokUserId: { type: string }
      handle: { type: string, example: 'colorkey_vn' }
      displayName: { type: string }
      bio: { type: string }
      followers: { type: integer }
      following: { type: integer }
      totalLikes: { type: integer }
      region: { type: string, example: 'US' }
      verified: { type: boolean }
      tiktokPostUrl: { type: string, format: uri }
      primaryImageUrl:
        type: string
        format: uri
        nullable: true
        description: Creator profile image (canonical avatar — use this for product cards and detail)
      avatarUrl:
        type: string
        format: uri
        nullable: true
        description: Legacy alias of `primaryImageUrl` (mirrored on read)
      avatarProxyUrl:
        type: string
        description: Same-origin proxy for `primaryImageUrl` when a linked creative exists (prefer over raw TikTok CDN URL)

  aiInsight:
    type: object
    description: |
      Client-facing AI intelligence (`aiIntelligence` reshaped on read).
      `marketingAnalysis`, `pageSummary`, and `reviewSummary` are populated on `GET /products/:id`;
      feed cards usually omit `marketingAnalysis` and summaries.
    properties:
      confidence:
        type: object
        properties:
          score:
            type: number
            minimum: 0
            maximum: 100
          reason:
            type: string
      buyingSentiment:
        type: object
        properties:
          score:
            type: number
            minimum: 0
            maximum: 100
          reason:
            type: string
          label:
            type: string
            enum: [positive, neutral, negative]
            description: Human-readable demand/sentiment bucket derived from score when not stored.
      reviewSummary:
        type: object
        nullable: true
        description: Review-grounded summary generated from customer reviews.
        properties:
          summary:
            type: string
          generatedAt:
            type: string
            format: date-time
      pageSummary:
        type: object
        nullable: true
        description: Full product-detail page narrative (traction, content, opportunity).
        properties:
          text:
            type: string
          highlights:
            type: array
            items:
              type: string
          generatedAt:
            type: string
            format: date-time
      marketingAnalysis:
        allOf:
          - $ref: ./MarketingAnalysis.yaml
        nullable: true
      brand:
        type: string
        example: Angel Beyond
      niche:
        type: string
        example: Plus-size activewear
      audience:
        type: array
        items: { type: string }
      productType:
        type: string
        enum: [evergreen, trend-driven, seasonal, unknown]
      priceBand:
        type: string
        enum: [budget, mid-range, premium]
      problemStatement:
        type: string
      valueStatement:
        type: string
      extractedAt:
        type: string
        format: date-time

  trend:
    type: object
    required: [score, direction, isTrending]
    properties:
      score:
        type: number
        minimum: 0
        maximum: 5
      direction:
        type: string
        enum: [rising, peaked, saturating, stable, declining, emerging, viral, unknown]
      reason:
        type: string
        description: Optional narrative; omitted on some TikTok Shop rows.
      isTrending:
        type: boolean
      calculatedAt:
        type: string
        format: date-time

  discoverySections:
    type: array
    description: Discovery buckets this product belongs to.
    items:
      type: string
      enum: [top-ads, trending, new-3d, new-7d]

  isTopAd:
    type: boolean
    description: '`true` when `discoverySections` contains `top-ads`. Computed on read.'

  shopName:
    type: string
  shopUrl:
    type: string
    format: uri
  shopAvatarUrl:
    type: string
    format: uri
    nullable: true
  shopFollowers:
    type: integer
    minimum: 0
  postUrl:
    type: string
    format: uri
  postCreatedAt:
    type: string
    nullable: true
  productUrl:
    type: string
    format: uri
  officialWebsiteUrl:
    type: string
    format: uri
    nullable: true
    description: Merchant's own DTC storefront when provably the same store as the TikTok shop.
  officialProductUrl:
    type: string
    format: uri
    nullable: true
    description: Matching SKU on the merchant's own storefront, when known.
  storeLinks:
    type: array
    description: Ready-to-render storefront links for the product detail UI.
    items:
      type: object
      required: [platform, label, url, kind]
      properties:
        platform:
          type: string
          enum: [tiktok, shopify]
        label:
          type: string
        url:
          type: string
          format: uri
        kind:
          type: string
          enum: [store, product]

  creativeCounts:
    type: object
    nullable: true
    properties:
      ads: { type: integer }
      organic: { type: integer }
      reviews: { type: integer }
      total: { type: integer }

  validationStatus:
    type: string
    enum: [pending, valid, invalid]
    description: QA/ingest pipeline status (separate from catalog `status`).
    example: valid

  lastIngestedAt:
    type: string
    format: date-time
  dataSourceUpdatedAt:
    type: string
    format: date-time
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
