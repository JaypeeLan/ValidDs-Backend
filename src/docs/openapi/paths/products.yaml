feed:
  get:
    tags: [Products]
    summary: List products (paginated)
    description: |
      Returns active products with default pagination (`page`, `limit`).
      With no filters, this is the full catalog, one page at a time.
      Pass `q` to run full-text search on the same endpoint (matches by relevance; results are ordered by `sortBy`, default **`gmv`** = highest `totalGmv` first).
    parameters:
      - name: q
        in: query
        required: false
        description: Full-text search query (optional).
        schema: { type: string, maxLength: 200 }
      - name: page
        in: query
        schema: { type: integer, default: 1, minimum: 1 }
      - name: limit
        in: query
        schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      - name: category
        in: query
        description: Filter by category. Pass multiple times or as comma-separated string for multi-select.
        schema: 
          type: array
          items:
            type: string
      - name: trendDirection
        in: query
        schema: { type: string, enum: [rising, peaked, saturating, unknown] }
      - name: minTrendScore
        in: query
        schema: { type: number }
      - name: minViews
        in: query
        schema: { type: number }
      - name: isAd
        in: query
        description: When true, same as discovery bucket top-ads; when false, excludes products tagged top-ads. (Uses `discoverySections`, not a separate adSignals field.)
        schema: { type: boolean }
      - name: section
        in: query
        description: Require this discovery section slug on the product (e.g. `top-ads` for top ads).
        schema:
          type: string
          enum: [top-ads, trending, top-rated, viral, influencer-reviews, tutorials, viral-unboxings]
      - name: sortBy
        in: query
        description: Sort order for results. Default `gmv` sorts by `totalGmv` descending (highest first).
        schema: { type: string, enum: [gmv, trendScore, views, recent, engagement], default: gmv }
      - name: subcategory
        in: query
        description: Filter by subcategory (L2). Pass multiple times or comma-separated for multi-select.
        schema:
          type: array
          items:
            type: string
      - name: region
        in: query
        schema: { type: string }
    responses:
      '200':
        description: List of products retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        products:
                          type: array
                          items:
                            $ref: '../components/schemas/Product.yaml'
                        pagination:
                          type: object
                        freshness:
                          type: object
                        region:
                          type: string

keywordContext:
  get:
    tags: [Products]
    summary: Search TikTok keyword context
    parameters:
      - name: name
        in: query
        required: true
        schema: { type: string }
      - name: timeFilter
        in: query
        schema: { type: integer, enum: [1, 7, 30, 90, 180], default: 30 }
      - name: sortOrder
        in: query
        schema: { type: integer, enum: [0, 1], default: 0 }
      - name: country
        in: query
        schema: { type: string, example: us }
      - name: cursor
        in: query
        schema: { type: integer, default: 0 }
      - name: matchExactly
        in: query
        schema: { type: boolean, default: false }
    responses:
      '200':
        description: Keyword context retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        keyword: { type: string }
                        filters:
                          type: object
                          properties:
                            timeFilter: { type: integer, enum: [1, 7, 30, 90, 180] }
                            sortOrder: { type: integer, enum: [0, 1] }
                            country: { type: string }
                            matchExactly: { type: boolean }
                        pagination:
                          type: object
                          properties:
                            cursor: { type: integer }
                            nextCursor: { type: integer, nullable: true }
                        suggestedHashtags:
                          type: array
                          items: { type: string }
                        posts:
                          type: array
                          items:
                            type: object
                            properties:
                              videoId: { type: string }
                              videoUrl: { type: string }
                              videoPlayUrl: { type: string }
                              creatorHandle: { type: string }
                              creatorDisplayName: { type: string }
                              creatorFollowers: { type: integer }
                              creatorRegion: { type: string }

detail:
  get:
    tags: [Products]
    summary: Get product by ID
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Product details retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        product: { $ref: '../components/schemas/Product.yaml' }
      '404':
        $ref: '../components/responses/Standard.yaml#/NotFoundResponse'

categories:
  get:
    tags: [Products]
    summary: List all L1 categories
    description: Returns all top-level (L1) category names as a flat array.
    responses:
      '200':
        description: Categories retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        categories:
                          type: array
                          items:
                            type: string
                          example:
                            - Beauty & Personal Care
                            - Fashion
                            - Health & Wellness
                            - Home & Kitchen
                            - Food & Beverage
                            - Electronics & Tech
                            - Sports & Outdoors
                            - Pets
                            - Kids & Baby
                            - Automotive
                            - Tools & Home Improvement

subcategories:
  get:
    tags: [Products]
    summary: List L2 subcategories
    description: |
      Without `category`: returns an object mapping every L1 → its L2 subcategories.

      With `category`: returns a flat array of L2 subcategories for that specific L1.
    parameters:
      - name: category
        in: query
        required: false
        description: L1 category name. If omitted, all mappings are returned.
        schema:
          type: string
          example: Beauty & Personal Care
    responses:
      '200':
        description: Subcategories retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      oneOf:
                        - type: array
                          description: Subcategories for a single L1 (when `category` is passed)
                          items: { type: string }
                          example: [Skincare, Makeup & Cosmetics, Hair Care]
                        - type: object
                          description: Full L1 → L2 mapping (when no `category` is passed)
                          additionalProperties:
                            type: array
                            items: { type: string }

taxonomy:
  get:
    tags: [Products]
    summary: Full category taxonomy (L1 → L2 → L3)
    description: |
      Returns the complete three-level category taxonomy.

      - **L1** — top-level category (e.g. `"Beauty & Personal Care"`)
      - **L2** — subcategory (e.g. `"Skincare"`)
      - **L3** — leaf / product type array (e.g. `["Face Serums", "Moisturizers & Creams"]`)

      Use this to build category pickers, filter chips, or validate incoming product classifications.
    responses:
      '200':
        description: Full taxonomy retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: L1 → L2 → L3[] nested object
                      additionalProperties:
                        type: object
                        additionalProperties:
                          type: array
                          items: { type: string }
