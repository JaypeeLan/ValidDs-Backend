type: object
required:
  - id
  - externalId
  - source
  - status
  - title
  - normalizedTitle
  - categoryL1
  - categoryPath
  - aiInsight
  - trend
properties:
  id:
    type: string
    example: 60b9b3b3e2b4f9a0c8b2c1d4

  externalId:
    type: string
    description: Source-specific external identifier.
  source:
    type: string
    enum: [scarper, manual]
    description: Ingestion source.
  status:
    type: string
    enum: [active, review, invalid]
    description: "`active` = live in the feed; `review` = pending QA; `invalid` = rejected."

  title:
    type: string
    maxLength: 120
  normalizedTitle:
    type: string
  description:
    type: string
    maxLength: 2000
  hashtags:
    type: array
    items:
      type: string

  categoryL1:
    type: string
    example: "Beauty & Personal Care"
  categoryL2:
    type: string
    example: "Skincare"
  categoryL3:
    type: string
    example: "Face Serums"
  categoryPath:
    type: string
    example: "Beauty & Personal Care > Skincare > Face Serums"

  primaryImageUrl:
    type: string
    format: uri
  imageUrls:
    type: array
    items:
      type: string
      format: uri

  price:
    type: number
    minimum: 0
    example: 24.99
  currency:
    type: string
    example: USD

  priceHistory:
    type: array
    description: Historical price snapshots recorded at ingestion time.
    items:
      type: object
      properties:
        price:
          type: number
        currency:
          type: string
        recordedAt:
          type: string
          description: ISO date string (YYYY-MM-DD).

  suppliers:
    type: array
    description: Marketplace / supplier listings found for this product.
    items:
      type: object
      properties:
        source:
          type: string
          example: amazon
        platform:
          type: string
          example: Amazon
        externalId:
          type: string
        title:
          type: string
        productUrl:
          type: string
          format: uri
        shareUrl:
          type: string
          format: uri
        price:
          type: number
          nullable: true
        onSale:
          type: boolean
        currency:
          type: string
        rating:
          type: number
          nullable: true
        totalRatings:
          type: integer
          nullable: true
        totalReviews:
          type: integer
          nullable: true
        soldLast30Days:
          type: integer
          nullable: true
        availableForSale:
          type: boolean
        shippingDays:
          type: integer
        moq:
          type: integer
          description: Minimum order quantity.
        shop:
          type: object
          nullable: true
          properties:
            name: { type: string }
            url: { type: string, format: uri }
            rating: { type: number, nullable: true }
        monthlyTraffic:
          type: integer
          nullable: true
        productUnitsSold:
          type: integer
          nullable: true
        estimatedMonthlyRevenue:
          type: number
          nullable: true
        revenueSource:
          type: string
          enum: [product-sales, traffic-estimate]
          nullable: true
        competitorScore:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        checkedAt:
          type: string
          format: date-time
        fetchedAt:
          type: string
          format: date-time

  rating:
    type: number
    minimum: 0
    maximum: 5
    description: Weighted average rating derived from all rating sources (1–5).
  reviewCount:
    type: integer
    description: Total review count across all sources.

  ratingSources:
    type: array
    description: Per-platform rating breakdown used to derive the weighted average.
    items:
      type: object
      properties:
        platform: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        sourceUrl: { type: string, format: uri }
        fetchedAt: { type: string, format: date-time }

  reviews:
    type: array
    description: Review snippets from ingestion sources.
    items:
      type: object
      properties:
        author: { type: string, nullable: true }
        rating: { type: number, nullable: true }
        content: { type: string, nullable: true }
        date: { type: string, nullable: true }
        item: { type: string, nullable: true }

  soldCount:
    type: integer
    minimum: 0
    description: Lifetime sold count (from TikTok Shop scraper where available).
  totalSales:
    type: number
    minimum: 0
  totalGmv:
    type: number
    minimum: 0
    description: Total gross merchandise value.

  viewCount:
    type: integer
    description: Views on the discovery post.
  likeCount:
    type: integer
  commentCount:
    type: integer
  shareCount:
    type: integer
  engagementRate:
    type: number
    nullable: true

  primaryCreator:
    type: object
    description: TikTok creator who posted the discovery video.
    properties:
      handle: { type: string, example: "@naturalglow" }
      displayName: { type: string }
      followers: { type: integer }
      verified: { type: boolean }
      tiktokPostUrl: { type: string, format: uri }
      avatarUrl:       { type: string, format: uri, nullable: true }
      primaryImageUrl: { type: string, format: uri, nullable: true, description: "Creator avatar — same as avatarUrl, for consistent frontend access" }

  aiInsight:
    type: object
    description: AI-derived product intelligence (transformed from raw extraction).
    properties:
      confidence:
        type: object
        properties:
          score:
            type: number
            minimum: 0
            maximum: 100
            description: How confident the AI is this is a real product.
          reason:
            type: string
      buyingSentiment:
        type: object
        properties:
          score:
            type: number
            minimum: 0
            maximum: 100
            description: Percentage of comments expressing buying intent.
          reason:
            type: string

  trend:
    type: object
    required: [score, direction, isTrending]
    properties:
      score:
        type: number
        minimum: 0
        maximum: 5
      direction:
        type: string
        enum: [rising, peaked, saturating, stable, declining, emerging, viral, unknown]
      reason:
        type: string
      isTrending:
        type: boolean
      calculatedAt:
        type: string
        format: date-time

  discoverySections:
    type: array
    description: Discovery buckets this product belongs to.
    items:
      type: string
      enum: [top-ads, trending, top-rated, viral, influencer-reviews, tutorials, viral-unboxings]

  isTopAd:
    type: boolean
    description: "`true` when `discoverySections` contains `top-ads`. Computed on read."

  shopName:
    type: string
  shopUrl:
    type: string
    format: uri
  shopFollowers:
    type: integer
    minimum: 0
  postUrl:
    type: string
    format: uri
  postCreatedAt:
    type: string
    nullable: true
  productUrl:
    type: string
    format: uri

  validationStatus:
    type: string
    example: pending

  lastIngestedAt:
    type: string
    format: date-time
  dataSourceUpdatedAt:
    type: string
    format: date-time
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
