feed:
  get:
    tags: [Products]
    summary: List products (paginated)
    description: |
      Returns active products with default pagination (`page`, `limit`).
      With no filters, this is the full catalog, one page at a time.
      Pass `q` or `search` to find products by title/description. Search results are ranked by **relevance only** (`sortBy` is ignored). Multi-word queries use phrase matching first.
    parameters:
      - name: q
        in: query
        required: false
        description: Full-text search query (optional). Alias `search`.
        schema: { type: string, maxLength: 200 }
      - name: search
        in: query
        required: false
        description: Alias for `q` (same relevance ranking).
        schema: { type: string, maxLength: 200 }
      - name: page
        in: query
        schema: { type: integer, default: 1, minimum: 1 }
      - name: limit
        in: query
        schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      - name: category
        in: query
        description: Filter by category. Pass multiple times or as comma-separated string for multi-select.
        schema:
          type: array
          items:
            type: string
      - name: trendDirection
        in: query
        schema:
          {
            type: string,
            enum: [rising, peaked, saturating, emerging, unknown, declining, stable, viral],
          }
      - name: minTrendScore
        in: query
        schema: { type: number }
      - name: minViews
        in: query
        schema: { type: number }
      - name: isAd
        in: query
        description: When true, same as discovery bucket top-ads; when false, excludes products tagged top-ads. (Uses `discoverySections`, not a separate adSignals field.)
        schema: { type: boolean }
      - name: section
        in: query
        description: Require this discovery section slug on the product (e.g. `top-ads` for top ads).
        schema:
          type: string
          enum: [top-ads, trending, new-3d, new-7d]
      - name: feed
        in: query
        required: false
        description: |
          UI convenience tab. When `sortBy` is omitted:
          - `discover` defaults to `recent`
          - `top-opportunities` defaults to `gmv-desc`
        schema:
          type: string
          enum: [discover, top-opportunities]
      - name: sortBy
        in: query
        description: |
          Sort order. Use snake_case from the UI (`gmv_desc`, `units_sold_desc`, …).
          Defaults depend on `feed` when omitted.
        schema:
          type: string
          example: gmv_desc
      - name: productKind
        in: query
        description: Product type filter — `hot` (momentum score) or `seasonal` (AI productType).
        schema: { type: string, enum: [hot, seasonal] }
      - name: productType
        in: query
        description: Alias of `productKind`.
        schema: { type: string, enum: [hot, seasonal] }
      - name: confidenceLevel
        in: query
        schema: { type: string, enum: [High, Medium, Low] }
      - name: opportunityLevel
        in: query
        description: Filters engagement trend score (opportunity).
        schema: { type: string, enum: [High, Medium, Low] }
      - name: minPrice
        in: query
        schema: { type: number, minimum: 0 }
      - name: maxPrice
        in: query
        schema: { type: number, minimum: 0 }
      - name: minTotalGmv
        in: query
        schema: { type: number, minimum: 0 }
      - name: maxTotalGmv
        in: query
        schema: { type: number, minimum: 0 }
      - name: minUnitsSold
        in: query
        schema: { type: number, minimum: 0 }
      - name: maxUnitsSold
        in: query
        schema: { type: number, minimum: 0 }
      - name: minUnits
        in: query
        description: Alias of minUnitsSold (frontend).
        schema: { type: number, minimum: 0 }
      - name: maxUnits
        in: query
        description: Alias of maxUnitsSold (frontend).
        schema: { type: number, minimum: 0 }
      - name: minGmv
        in: query
        description: Alias of minTotalGmv (frontend).
        schema: { type: number, minimum: 0 }
      - name: maxGmv
        in: query
        description: Alias of maxTotalGmv (frontend).
        schema: { type: number, minimum: 0 }
      - name: minLikes
        in: query
        description: Minimum total likes on the source TikTok post (`likeCount`).
        schema: { type: number, minimum: 0, example: 10000 }
      - name: minEngagementRate
        in: query
        description: Minimum likes÷views ratio as a percent (e.g. `1` = 1%).
        schema: { type: number, minimum: 0, maximum: 100, example: 1 }
      - name: startDate
        in: query
        description: Only posts on or after this date (ISO `YYYY-MM-DD`, UTC start of day).
        schema: { type: string, format: date, example: '2026-04-29' }
      - name: minCreatorGmv
        in: query
        description: Minimum shop GMV for the product seller (`storeGmv`).
        schema: { type: number, minimum: 0 }
      - name: maxCreatorGmv
        in: query
        description: Maximum shop GMV (`storeGmv`).
        schema: { type: number, minimum: 0 }
      - name: minFollowers
        in: query
        description: Minimum `primaryCreator.followers`.
        schema: { type: integer, minimum: 0 }
      - name: maxFollowers
        in: query
        description: Maximum `primaryCreator.followers`.
        schema: { type: integer, minimum: 0 }
      - name: minCreatorLikes
        in: query
        description: Minimum `primaryCreator.totalLikes`.
        schema: { type: integer, minimum: 0 }
      - name: maxCreatorLikes
        in: query
        description: Maximum `primaryCreator.totalLikes`.
        schema: { type: integer, minimum: 0 }
      - name: minSales7d
        in: query
        description: Filter by salesTrend window at daysAgo=7 (when present on product).
        schema: { type: number, minimum: 0 }
      - name: maxSales7d
        in: query
        schema: { type: number, minimum: 0 }
      - name: minGmv7d
        in: query
        description: Filter by revenueTrend window at daysAgo=7 (when present on product).
        schema: { type: number, minimum: 0 }
      - name: maxGmv7d
        in: query
        schema: { type: number, minimum: 0 }
      - name: minConfidence
        in: query
        schema: { type: number, minimum: 0, maximum: 100 }
      - name: minCompetitionScore
        in: query
        schema: { type: number, minimum: 0, maximum: 100 }
      - name: maxCompetitionScore
        in: query
        schema: { type: number, minimum: 0, maximum: 100 }
      - name: subcategory
        in: query
        description: Filter by subcategory (L2, stored as `categoryL2`). OR match when multiple values are provided. Repeat the param, use comma-separated values, or pass a JSON array.
        schema:
          type: array
          items:
            type: string
      - name: subcategories
        in: query
        description: Alias of `subcategory` (same multi-select behavior).
        schema:
          type: array
          items:
            type: string
      - name: categoryL2
        in: query
        description: Alias of `subcategory`.
        schema:
          type: array
          items:
            type: string
      - name: region
        in: query
        schema: { type: string }
    responses:
      '200':
        description: List of products retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        products:
                          type: array
                          items:
                            $ref: '../components/schemas/ProductFeedItem.yaml'
                        pagination:
                          type: object
                        freshness:
                          type: object
                        region:
                          type: string

keywordContext:
  get:
    tags: [Products]
    summary: Search TikTok keyword context
    parameters:
      - name: name
        in: query
        required: true
        schema: { type: string }
      - name: timeFilter
        in: query
        schema: { type: integer, enum: [1, 7, 30, 90, 180], default: 30 }
      - name: sortOrder
        in: query
        schema: { type: integer, enum: [0, 1], default: 0 }
      - name: country
        in: query
        schema: { type: string, example: us }
      - name: cursor
        in: query
        schema: { type: integer, default: 0 }
      - name: matchExactly
        in: query
        schema: { type: boolean, default: false }
    responses:
      '200':
        description: Keyword context retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        keyword: { type: string }
                        filters:
                          type: object
                          properties:
                            timeFilter: { type: integer, enum: [1, 7, 30, 90, 180] }
                            sortOrder: { type: integer, enum: [0, 1] }
                            country: { type: string }
                            matchExactly: { type: boolean }
                        pagination:
                          type: object
                          properties:
                            cursor: { type: integer }
                            nextCursor: { type: integer, nullable: true }
                        suggestedHashtags:
                          type: array
                          items: { type: string }
                        posts:
                          type: array
                          items:
                            type: object
                            properties:
                              videoId: { type: string }
                              videoUrl: { type: string }
                              videoPlayUrl: { type: string }
                              creatorHandle: { type: string }
                              creatorDisplayName: { type: string }
                              creatorFollowers: { type: integer }
                              creatorRegion: { type: string }

detail:
  get:
    tags: [Products]
    summary: Get product by ID
    description: |
      Returns the full product, same-category **related products** (feed card shape),
      **related videos** (commercial — non-ad creatives) and **related ads** (paid / top-ad only).

      The two arrays are **mutually exclusive**.
      Each item uses the `Creative` schema (proxy URLs + nested `relatedVideos` on each doc).
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Product details retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [product, relatedProducts, relatedVideos, relatedAds, freshness]
                      properties:
                        product:
                          $ref: '../components/schemas/Product.yaml'
                        relatedProducts:
                          type: array
                          description: Up to 8 products in the same L2 subcategory (feed card shape).
                          items:
                            $ref: '../components/schemas/ProductFeedItem.yaml'
                        relatedVideos:
                          type: array
                          description: |
                            Commercial (non-ad) creatives for this product. Sorted by views.
                          items:
                            $ref: '../components/schemas/Creative.yaml'
                        relatedAds:
                          type: array
                          description: |
                            Top-ad / paid creatives for this product. Sorted by views.
                          items:
                            $ref: '../components/schemas/Creative.yaml'
                        freshness:
                          type: object
                          description: Data freshness metadata for the product catalog.
      '404':
        $ref: '../components/responses/Standard.yaml#/NotFoundResponse'

relatedProducts:
  get:
    tags: [Products]
    summary: Related products for a product
    description: |
      Related products in the same L2 subcategory (feed card shape), including L2 alias
      variants (e.g. Makeup vs Makeup & Cosmetics). Excludes the current product, duplicate
      titles, and non-listable rows. Same data as `relatedProducts` on
      `GET /products/{id}` without loading the full product payload.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
    responses:
      '200':
        description: Related products retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [relatedProducts]
                      properties:
                        relatedProducts:
                          type: array
                          items:
                            $ref: '../components/schemas/ProductFeedItem.yaml'
      '404':
        $ref: '../components/responses/Standard.yaml#/NotFoundResponse'

similarProducts:
  get:
    tags: [Products]
    summary: Similar products for a product
    description: |
      Alias of `GET /products/{id}/related-products` (feed card shape).
      Returns products in the same L2 subcategory only (including alias variants).
      Excludes the current product, items with the same `normalizedTitle`, and duplicate
      listings (same title + shop).
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
    responses:
      '200':
        description: Similar products retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [relatedProducts]
                      properties:
                        relatedProducts:
                          type: array
                          items:
                            $ref: '../components/schemas/ProductFeedItem.yaml'
      '404':
        $ref: '../components/responses/Standard.yaml#/NotFoundResponse'

relatedVideos:
  get:
    tags: [Products]
    summary: Related videos (non-ad) for a product
    description: |
      Commercial TikTok creatives linked to this product (DB `top-ads`, API `trending` bucket).
      Mutually exclusive with `relatedAds`. Sorted by view count descending.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    responses:
      '200':
        description: Related videos retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [relatedVideos]
                      properties:
                        relatedVideos:
                          type: array
                          items:
                            $ref: '../components/schemas/Creative.yaml'
      '404':
        $ref: '../components/responses/Standard.yaml#/NotFoundResponse'

relatedAds:
  get:
    tags: [Products]
    summary: Related ads for a product
    description: |
      Paid / top-ad creatives for this product (DB `trending`, API `top-ads` bucket).
      Mutually exclusive with `relatedVideos`. Sorted by view count descending.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    responses:
      '200':
        description: Related ads retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [relatedAds]
                      properties:
                        relatedAds:
                          type: array
                          items:
                            $ref: '../components/schemas/Creative.yaml'
      '404':
        $ref: '../components/responses/Standard.yaml#/NotFoundResponse'

categories:
  get:
    tags: [Categories]
    operationId: fetchCategories
    summary: Fetch categories (L1)
    description: |
      Returns top-level (L1) category names that have at least one listable product
      in the current market (canonical order). Empty categories are omitted.

      Does **not** return products — use `GET /products` with `?category=` to filter the feed.
    responses:
      '200':
        description: Categories retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        categories:
                          type: array
                          items:
                            type: string
                          example:
                            - Beauty & Personal Care
                            - Fashion
                            - Health & Wellness
                            - Home & Kitchen
                            - Food & Beverage
                            - Electronics & Tech
                            - Sports & Outdoors
                            - Pets
                            - Kids & Baby
                            - Automotive
                            - Tools & Home Improvement

subcategories:
  get:
    tags: [Categories]
    operationId: fetchSubcategories
    summary: Fetch subcategories (L2)
    description: |
      Without `category`: returns an object mapping each L1 (with products) → its L2
      subcategories that also have at least one listable product.

      With `category`: returns a flat array of L2 subcategories for that L1 that have products.

      L1/L2 entries with zero products are omitted.

      Does **not** return products — use `GET /products` with `?subcategory=` to filter the feed.
    parameters:
      - name: category
        in: query
        required: false
        description: L1 category name. If omitted, all mappings are returned.
        schema:
          type: string
          example: Beauty & Personal Care
    responses:
      '200':
        description: Subcategories retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      oneOf:
                        - type: array
                          description: Subcategories for a single L1 (when `category` is passed)
                          items: { type: string }
                          example: [Skincare, Makeup & Cosmetics, Hair Care]
                        - type: object
                          description: Full L1 → L2 mapping (when no `category` is passed)
                          additionalProperties:
                            type: array
                            items: { type: string }

taxonomy:
  get:
    tags: [Categories]
    operationId: fetchCategoryTaxonomy
    summary: Fetch full category taxonomy (L1 → L2 → L3)
    description: |
      Returns the complete three-level category taxonomy.

      - **L1** — top-level category (e.g. `"Beauty & Personal Care"`)
      - **L2** — subcategory (e.g. `"Skincare"`)
      - **L3** — leaf / product type array (e.g. `["Face Serums", "Moisturizers & Creams"]`)

      Use this to build category pickers, filter chips, or validate incoming product classifications.
    responses:
      '200':
        description: Full taxonomy retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: L1 → L2 → L3[] nested object
                      additionalProperties:
                        type: object
                        additionalProperties:
                          type: array
                          items: { type: string }
