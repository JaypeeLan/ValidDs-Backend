billingConfig:
  get:
    tags: [Billing]
    summary: Available billing providers (authenticated)
    description: |
      Returns which checkout providers the API can use right now. Call this before rendering a pricing
      page so the client knows whether to offer Stripe, Shopify, or both.

      - **stripe** — included when the Stripe secret key is configured.
      - **shopify** — included when Shopify OAuth credentials are configured (`SHOPIFY_API_KEY`, etc.).

      Use `defaultProvider` (`stripe`) when the user does not choose a provider. Pass `provider` explicitly
      to `POST /billing/checkout`.

      Shopify checkout additionally requires `BILLING_PROVIDER=shopify`, plan price env vars
      (`SHOPIFY_PLAN_PRICE_*_CENTS`), and a connected store (`GET /stores/shopify/status`).
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Provider availability
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - providers
                        - defaultProvider
                        - stripeConfigured
                        - shopifyConfigured
                        - shopifyBillingTest
                        - requiresShopifyStore
                      properties:
                        providers:
                          type: array
                          items:
                            type: string
                            enum: [stripe, shopify]
                          description: Checkout providers available on this deployment.
                          example: [stripe, shopify]
                        defaultProvider:
                          type: string
                          enum: [stripe, shopify]
                          example: stripe
                        stripeConfigured:
                          type: boolean
                        shopifyConfigured:
                          type: boolean
                          description: True when Shopify OAuth env vars are set.
                        shopifyBillingTest:
                          type: boolean
                          description: True when `SHOPIFY_BILLING_TEST=true` or `NODE_ENV` is not production.
                        requiresShopifyStore:
                          type: boolean
                          description: Always `true` — Shopify checkout needs a connected merchant store.
            example:
              success: true
              message: OK
              data:
                providers: [stripe, shopify]
                defaultProvider: stripe
                stripeConfigured: true
                shopifyConfigured: true
                shopifyBillingTest: true
                requiresShopifyStore: true
      '401':
        $ref: '../components/responses/Standard.yaml#/UnauthorizedResponse'

listPlans:
  get:
    tags: [Billing]
    summary: List purchasable plans
    description: |
      Returns **explorer**, **pro**, and **premium** plan metadata — credit limits, price data, free trial
      days, and the default redirect URLs checkout will use.

      The top-level `provider` field reflects the server's `BILLING_PROVIDER` env (`stripe` or `shopify`) and
      controls which price source populates `plans[].price`. For side-by-side checkout, call
      `GET /billing/config` to see which providers are available, then pass `provider` to
      `POST /billing/checkout`.

      Each plan includes `stripePriceConfigured` and `shopifyPriceConfigured` so the UI can show which
      providers are ready for that tier.

      **Free trial:** every plan includes `trialDays` days free. Pass `withTrial: false` in
      `POST /billing/checkout` to skip the trial.

      **checkoutRedirects** shows default success/cancel URLs when `successUrl` / `cancelUrl` are omitted.
      Stripe success URLs contain `{CHECKOUT_SESSION_ID}`; Shopify uses `?provider=shopify`.

      After checkout, call `GET /billing/subscription` (or `POST /billing/shopify/sync` for Shopify) —
      plan provisioning happens via webhook, not the browser redirect alone.
    responses:
      '200':
        description: Plan catalog, Stripe price data, and default redirect URLs
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        [provider, mode, trialDays, requiresShopifyStore, plans, checkoutRedirects]
                      properties:
                        provider:
                          type: string
                          enum: [stripe, shopify]
                          description: Catalog price source — mirrors `BILLING_PROVIDER` env.
                        mode:
                          type: string
                          enum: [test, live]
                          description: Test unless production (Stripe) or `SHOPIFY_BILLING_TEST` (Shopify).
                        requiresShopifyStore:
                          type: boolean
                          description: True when `provider` is `shopify`.
                        trialDays:
                          type: integer
                          example: 7
                          description: Free trial days applied to every new subscription.
                        checkoutRedirects:
                          type: object
                          required: [defaultSuccessUrl, defaultCancelUrl]
                          properties:
                            defaultSuccessUrl:
                              type: string
                              format: uri
                              description: |
                                Default success redirect. Contains `{CHECKOUT_SESSION_ID}` placeholder
                                which Stripe replaces with the real session ID on redirect.
                            defaultCancelUrl:
                              type: string
                              format: uri
                        plans:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                              - limits
                              - trialDays
                              - stripePriceConfigured
                              - shopifyPriceConfigured
                              - price
                            properties:
                              id:
                                type: string
                                enum: [explorer, pro, premium]
                              trialDays:
                                type: integer
                                example: 7
                              stripePriceConfigured:
                                type: boolean
                                description: False if the Stripe price ID env var is missing — Stripe checkout returns 503.
                              shopifyPriceConfigured:
                                type: boolean
                                description: False if `SHOPIFY_PLAN_PRICE_*_CENTS` is missing — Shopify checkout returns 503.
                              limits:
                                type: object
                                properties:
                                  creditsPerMonth:
                                    type: integer
                                    example: 60000
                                  productsPerDay:
                                    type: integer
                                    description: -1 means unlimited.
                                  searchesPerDay:
                                    type: integer
                                    description: -1 means unlimited.
                                  savedProductsMax:
                                    type: integer
                                    description: -1 means unlimited.
                              price:
                                description: Loaded live from Stripe. Null if Stripe is not configured.
                                nullable: true
                                type: object
                                properties:
                                  amountCents:
                                    nullable: true
                                    type: integer
                                    example: 3999
                                  currency:
                                    nullable: true
                                    type: string
                                    example: usd
                                  interval:
                                    nullable: true
                                    type: string
                                    enum: [month, year]
            example:
              success: true
              message: 'OK'
              data:
                provider: stripe
                mode: test
                trialDays: 7
                requiresShopifyStore: false
                checkoutRedirects:
                  defaultSuccessUrl: 'https://app.validds.com/billing/success?session_id={CHECKOUT_SESSION_ID}'
                  defaultCancelUrl: 'https://app.validds.com/billing'
                plans:
                  - id: explorer
                    trialDays: 7
                    stripePriceConfigured: true
                    shopifyPriceConfigured: true
                    limits:
                      {
                        creditsPerMonth: 15000,
                        productsPerDay: -1,
                        searchesPerDay: -1,
                        savedProductsMax: 500,
                      }
                    price: { amountCents: 1999, currency: usd, interval: month }
                  - id: pro
                    trialDays: 7
                    stripePriceConfigured: true
                    shopifyPriceConfigured: true
                    limits:
                      {
                        creditsPerMonth: 60000,
                        productsPerDay: -1,
                        searchesPerDay: -1,
                        savedProductsMax: 2000,
                      }
                    price: { amountCents: 3999, currency: usd, interval: month }
                  - id: premium
                    trialDays: 7
                    stripePriceConfigured: true
                    shopifyPriceConfigured: true
                    limits:
                      {
                        creditsPerMonth: 200000,
                        productsPerDay: -1,
                        searchesPerDay: -1,
                        savedProductsMax: -1,
                      }
                    price: { amountCents: 9999, currency: usd, interval: month }

createCheckoutSession:
  post:
    tags: [Billing]
    summary: Create checkout session (Stripe or Shopify) (authenticated)
    description: |
      Creates a hosted checkout session for a paid plan.

      Use `provider: "stripe"` (default) for Stripe Checkout, or `provider: "shopify"` for Shopify App
      Billing (requires a connected store and `BILLING_PROVIDER=shopify`).

      Returns `data.url` — redirect the user's browser to this URL to complete checkout.

      **Stripe**
      - Free trial (default): card is collected but not charged until `trialDays` elapse.
      - Pass `"withTrial": false` to charge on the first billing cycle immediately.
      - Success redirect → `FRONTEND_URL/billing/success?session_id=cs_...`
      - Plan is provisioned via `checkout.session.completed` webhook.

      **Shopify**
      - Merchant approves the charge in Shopify Admin (`confirmationUrl`).
      - Success redirect → `FRONTEND_URL/billing/success?provider=shopify&plan=...`
      - Call `POST /billing/shopify/sync` after redirect (or rely on `app_subscriptions/update` webhook).
      - Returns 409 `BILLING_PROVIDER_CONFLICT` if the user already has an active Stripe subscription.

      After checkout, call `GET /billing/subscription` or `GET /auth/me` to refresh plan state in the UI.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [plan]
            properties:
              provider:
                type: string
                enum: [stripe, shopify]
                default: stripe
                description: Billing provider. Shopify requires the user to have a connected store.
              plan:
                type: string
                enum: [explorer, pro, premium]
                description: The plan to subscribe to.
              withTrial:
                type: boolean
                default: true
                description: |
                  `true` (default) — start with a free trial, card not charged until trial ends.
                  `false` — skip the trial, charge on first billing cycle immediately.
              successUrl:
                type: string
                format: uri
                description: |
                  Override the default success redirect. Must include `{CHECKOUT_SESSION_ID}` if you
                  want to confirm the session on return (e.g. `https://yourapp.com/billing/success?session_id={CHECKOUT_SESSION_ID}`).
              cancelUrl:
                type: string
                format: uri
                description: Override the default cancel redirect.
          examples:
            withTrial:
              summary: Start free trial (default)
              value:
                provider: stripe
                plan: pro
            directSubscribe:
              summary: Subscribe immediately, no trial
              value:
                provider: stripe
                plan: pro
                withTrial: false
            shopifyApproval:
              summary: Shopify App Billing approval (requires connected store)
              value:
                provider: shopify
                plan: pro
    responses:
      '200':
        description: Checkout session created — redirect user to `data.url`
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [url, provider]
                      properties:
                        url:
                          type: string
                          format: uri
                          description: Hosted checkout / approval URL — navigate the browser here.
                          example: 'https://checkout.stripe.com/pay/cs_test_...'
                        sessionId:
                          type: string
                          nullable: true
                          description: Stripe Checkout Session ID (Stripe), or Shopify subscription GID (Shopify).
                          example: 'cs_test_a1b2c3...'
                        provider:
                          type: string
                          enum: [stripe, shopify]
      '400':
        $ref: '../components/responses/Standard.yaml#/BadRequestResponse'
      '401':
        $ref: '../components/responses/Standard.yaml#/UnauthorizedResponse'
      '409':
        description: Active Stripe subscription blocks Shopify checkout (`BILLING_PROVIDER_CONFLICT`).
      '503':
        description: Price ID / Shopify plan price not configured, or Shopify billing disabled.

syncShopifySubscription:
  post:
    tags: [Billing]
    summary: Sync Shopify subscription state (authenticated)
    description: |
      Polls the merchant's connected Shopify store for the active App Billing subscription and applies the
      matching ValidDs plan. Use this after the merchant approves Shopify billing when webhooks are not
      forwarded (local dev) or as a fallback if `app_subscriptions/update` was missed.

      Requires `BILLING_PROVIDER=shopify`, a connected store, and Shopify OAuth credentials.

      If no active subscription is found, the user is downgraded to `free`.
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Subscription synced from Shopify
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [synced, plan, subscription]
                      properties:
                        synced:
                          type: boolean
                          description: False when Shopify subscription name could not be mapped to a plan.
                        plan:
                          type: string
                          enum: [free, explorer, pro, premium]
                        subscription:
                          nullable: true
                          type: object
                          description: Active or pending Shopify app subscription row, if any.
                          properties:
                            id:
                              type: string
                              description: Shopify GraphQL subscription GID.
                            name:
                              type: string
                              example: ValidDs Pro
                            status:
                              type: string
                              enum: [ACTIVE, PENDING, CANCELLED, DECLINED, EXPIRED, FROZEN]
                            test:
                              type: boolean
                            trialDays:
                              type: integer
                            currentPeriodEnd:
                              nullable: true
                              type: string
                              format: date-time
                            amountCents:
                              nullable: true
                              type: integer
                            currency:
                              nullable: true
                              type: string
                            interval:
                              nullable: true
                              type: string
                              enum: [month, year]
            example:
              success: true
              message: Shopify subscription synced
              data:
                synced: true
                plan: pro
                subscription:
                  id: 'gid://shopify/AppSubscription/123456789'
                  name: ValidDs Pro
                  status: ACTIVE
                  test: true
                  trialDays: 7
                  currentPeriodEnd: null
                  amountCents: 7900
                  currency: usd
                  interval: month
      '401':
        $ref: '../components/responses/Standard.yaml#/UnauthorizedResponse'
      '503':
        description: Shopify billing not enabled or OAuth not configured.

getSubscription:
  get:
    tags: [Billing]
    summary: Current subscription and billing snapshot (authenticated)
    description: |
      Returns the authenticated user's live plan, credit balance, billing provider, Stripe/Shopify IDs,
      and last 10 transactions.

      Call after checkout success to confirm the plan upgrade. Auth middleware loads the user from the DB
      on every request, so plan state is current without re-login.

      For Shopify, call `POST /billing/shopify/sync` first if the plan has not updated yet.
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Subscription state
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        plan:
                          type: string
                          enum: [free, explorer, pro, premium]
                        creditBalance:
                          type: number
                          example: 60000
                        planExpiresAt:
                          nullable: true
                          type: string
                          format: date-time
                        billingProvider:
                          type: string
                          enum: [stripe, shopify]
                          description: Which provider bills this user (`stripe` when unset).
                        stripeCustomerId:
                          nullable: true
                          type: string
                        stripeSubscriptionId:
                          nullable: true
                          type: string
                        shopifySubscriptionId:
                          nullable: true
                          type: string
                          description: Shopify App Billing subscription GID.
                        shopifyBillingStatus:
                          nullable: true
                          type: string
                          description: Last known Shopify subscription status (e.g. ACTIVE, CANCELLED).
                        mode:
                          type: string
                          enum: [test, live]
                        transactions:
                          type: array
                          description: Last 10 transactions for this user.
                          items:
                            type: object
                            properties:
                              provider:
                                type: string
                                enum: [stripe, shopify]
                              status:
                                type: string
                                enum: [pending, paid, failed, refunded]
                              amount:
                                type: number
                              currency:
                                type: string
                              reference:
                                nullable: true
                                type: string
                                description: Stripe session/subscription ID or Shopify subscription GID.
      '401':
        $ref: '../components/responses/Standard.yaml#/UnauthorizedResponse'

cancelSubscription:
  post:
    tags: [Billing]
    summary: Cancel the authenticated user's subscription
    description: |
      Cancels the user's active subscription on Stripe or Shopify, depending on `billingProvider`.

      **Stripe (default `immediate: false`):** schedules cancellation at period end. Access continues until
      `cancelAt`. Stripe sends `customer.subscription.deleted` when the period ends, downgrading to `free`.

      **Stripe (`immediate: true`):** ends the subscription now and downgrades to `free`.

      **Shopify:** always cancels immediately via `appSubscriptionCancel` and downgrades to `free`.
      The `immediate` body field is ignored for Shopify.

      Requires an active paid plan and a `stripeSubscriptionId` or `shopifySubscriptionId` on the user.
    security:
      - BearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              immediate:
                type: boolean
                default: false
                description: When true, cancel immediately instead of at period end.
    responses:
      '200':
        description: Subscription cancelled or scheduled for cancellation
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - canceled
                        - immediate
                        - plan
                        - cancelAt
                        - provider
                        - stripeSubscriptionId
                        - shopifySubscriptionId
                      properties:
                        canceled:
                          type: boolean
                          example: true
                        immediate:
                          type: boolean
                          example: false
                        plan:
                          type: string
                          enum: [free, explorer, pro, premium]
                        cancelAt:
                          nullable: true
                          type: string
                          format: date-time
                          description: When access ends (null when cancelled immediately).
                        provider:
                          type: string
                          enum: [stripe, shopify]
                        stripeSubscriptionId:
                          nullable: true
                          type: string
                          description: Remaining Stripe subscription ID (null after immediate cancel).
                        shopifySubscriptionId:
                          nullable: true
                          type: string
                          description: Cleared after Shopify cancel.
      '400':
        description: No active subscription to cancel
      '401':
        $ref: '../components/responses/Standard.yaml#/UnauthorizedResponse'
      '502':
        description: Stripe or Shopify cancellation failed
      '503':
        description: Billing provider not configured

getTransactions:
  get:
    tags: [Billing]
    summary: Paginated billing history (authenticated)
    description: |
      Returns the authenticated user's full billing transaction history with pagination.
      Only transactions belonging to the current user are returned — `userId` is never accepted from the client.

      Each row includes `provider` (`stripe` or `shopify`) and `reference` (Stripe session/subscription ID
      or Shopify subscription GID).
    security:
      - BearerAuth: []
    parameters:
      - in: query
        name: page
        schema: { type: integer, minimum: 1, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      - in: query
        name: status
        schema:
          type: string
          enum: [pending, paid, failed, refunded]
    responses:
      '200':
        description: Paginated billing history
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [transactions, pagination]
                      properties:
                        transactions:
                          type: array
                          items:
                            type: object
                            properties:
                              provider:
                                type: string
                                enum: [stripe, shopify]
                              status:
                                type: string
                                enum: [pending, paid, failed, refunded]
                              amount:
                                type: number
                              currency:
                                type: string
                              reference:
                                nullable: true
                                type: string
                              mode:
                                type: string
                                enum: [test, live]
                        pagination:
                          type: object
                          properties:
                            page: { type: integer }
                            limit: { type: integer }
                            total: { type: integer }
                            totalPages: { type: integer }
      '401':
        $ref: '../components/responses/Standard.yaml#/UnauthorizedResponse'

stripeConfig:
  get:
    tags: [Billing]
    summary: Get Stripe publishable key
    description: |
      Returns the Stripe **publishable** key for the current environment.
      `test` mode unless `NODE_ENV=production`, which switches to live keys.

      Use this to initialise Stripe.js on the frontend. Secret keys never leave the server.
    responses:
      '200':
        description: Stripe client configuration
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        publishableKey:
                          type: string
                          example: 'pk_test_...'
                        mode:
                          type: string
                          enum: [test, live]
                        secretKeyConfigured:
                          type: boolean
      '503':
        description: Publishable key not configured in env.

stripeWebhook:
  post:
    tags: [Billing]
    summary: Stripe webhook receiver
    security: []
    description: |
      Receives signed events from Stripe. Must receive the **raw** request body — do not pass through
      any middleware that re-serialises JSON.

      **Local development:** `stripe listen --forward-to http://localhost:3000/api/v1/webhooks/stripe`

      **Production (Render):** Register `https://<api-host>/api/v1/webhooks/stripe` in
      Stripe Dashboard → Developers → Webhooks. Subscribe to:
      - `checkout.session.completed` — provisions plan on trial start
      - `customer.subscription.updated` — handles mid-cycle plan changes
      - `customer.subscription.deleted` — downgrades user to free on cancellation
      - `invoice.paid` — refreshes credits on renewal (after trial ends and on each billing cycle)
      - `invoice.payment_failed` — logs payment failure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: string
            description: Raw Stripe event JSON (must be Buffer on server side for signature verification).
    responses:
      '200':
        description: Event acknowledged
        content:
          application/json:
            schema:
              type: object
              properties:
                received:
                  type: boolean
                  example: true
      '400':
        description: Missing or invalid Stripe signature, or malformed payload.
      '503':
        description: Stripe or webhook secret not configured in env.

shopifyWebhook:
  post:
    tags: [Billing]
    summary: Shopify webhook receiver
    security: []
    description: |
      Receives signed webhooks from Shopify. Must receive the **raw** request body — registered before
      `express.json` in `app.ts`.

      **Headers (required):**
      - `X-Shopify-Topic` — event name
      - `X-Shopify-Hmac-Sha256` — HMAC signature
      - `X-Shopify-Shop-Domain` — store domain

      **Billing topics** (register in Partner Dashboard or `shopify.app.toml`):
      - `app_subscriptions/update` — provisions or downgrades plan when App Billing status changes
      - `app/uninstalled` — clears the ValidDs Shopify connection for that store

      **Compliance topics** (acknowledged, no side effects):
      - `customers/data_request`, `customers/redact`, `shop/redact`

      **Production URL:** `https://<api-host>/api/v1/webhooks/shopify`

      Without webhooks in local dev, use `POST /billing/shopify/sync` after the merchant approves billing.
    parameters:
      - in: header
        name: X-Shopify-Topic
        required: true
        schema:
          type: string
          example: app_subscriptions/update
      - in: header
        name: X-Shopify-Hmac-Sha256
        required: true
        schema:
          type: string
      - in: header
        name: X-Shopify-Shop-Domain
        required: true
        schema:
          type: string
          example: my-store.myshopify.com
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Raw Shopify webhook JSON (must be Buffer on server side for HMAC verification).
    responses:
      '200':
        description: Event acknowledged
        content:
          text/plain:
            schema:
              type: string
              example: OK
      '401':
        description: Invalid HMAC signature.
      '500':
        description: Handler error or body was not raw Buffer.
      '503':
        description: Shopify env vars not configured.
