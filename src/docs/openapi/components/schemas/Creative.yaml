type: object
required:
  - id
  - productId
  - externalVideoId
  - embedUrl
  - tiktokPostUrl
  - creator
  - metrics
  - section
  - isIndependentCreator
  - hashtags
properties:
  _id:
    type: string
    deprecated: true
    description: Legacy alias; API responses use `id`.
  id:
    type: string
    example: 60b9b3b3e2b4f9a0c8b2c1d3
  productId:
    type: string
    example: 60b9b3b3e2b4f9a0c8b2c1d4
  externalVideoId:
    type: string
    example: '7628237127481969942'
  embedUrl:
    type: string
    format: uri
    description: |
      Permanent TikTok embed URL (`https://www.tiktok.com/embed/v2/<id>`).
      Use in an `<iframe>` when CDN proxy playback is unavailable or expired.
  tiktokPostUrl:
    type: string
    format: uri
    description: Direct link to the TikTok post.
  thumbnailUrl:
    type: string
    format: uri
    nullable: true
  videoProxyUrl:
    type: string
    description: |
      Relative API path to stream the TikTok CDN MP4 (`GET /api/v1/creatives/{id}/video?index=0`).
      Requires a stored CDN `videoPlayUrl`; returns 404 if missing, 410 if expired — then use `embedUrl`.
    example: /api/v1/creatives/60b9b3b3e2b4f9a0c8b2c1d3/video?index=0
  thumbnailProxyUrl:
    type: string
    description: Relative API path for proxied cover image (`GET .../thumbnail?index=0&kind=thumbnail`).
    example: /api/v1/creatives/60b9b3b3e2b4f9a0c8b2c1d3/thumbnail?index=0&kind=thumbnail
  tiktokUrl:
    type: string
    format: uri
    nullable: true
    description: Direct link to view this post on TikTok. Null for Meta Ad Library creatives.

  section:
    type: string
    enum: [top-ads, trending]
    description: |
      API-facing section label. Ingestion stores inverted labels for the two main buckets:
      API `trending` ↔ DB `top-ads` (default list ~462 US); API `top-ads` ↔ DB `trending` (~19).

  isIndependentCreator:
    type: boolean
    description: Top-level flag — creator is not the product brand/seller.
  isPrimaryDiscovery:
    type: boolean
    description: True when this video was the primary discovery source for the product.
  isAd:
    type: boolean
    nullable: true
    description: True when the video is a paid advertisement.

  creator:
    $ref: ./CreativeCreator.yaml
  metrics:
    $ref: ./CreativeMetrics.yaml

  productName:
    type: string
  productDescription:
    type: string
    maxLength: 2000
    description: Full product description — **detail** (`GET /creatives/{id}`) only; omitted from list/feed cards.

  categoryL1:
    type: string
  categoryL2:
    type: string
  categoryL3:
    type: string
  categoryPath:
    type: string
    example: 'Beauty & Personal Care > Skincare > Face Serums'

  description:
    type: string
    maxLength: 2000
    nullable: true
    description: Video caption / description.
  angle:
    type: string
    nullable: true
    description: |
      Per-clip marketing hook derived from this video's transcript (AI).
      Independent of product `aiInsight.marketingAnalysis.angles`.
    example: Stop scrolling if your blush never lasts past lunch.
  angleBody:
    type: string
    maxLength: 2000
    nullable: true
    description: Per-clip video concept (1–2 sentences) for this creative.
    example: This blush delivers buildable pigment that stays put through a full workday.
  angleTarget:
    type: string
    maxLength: 200
    nullable: true
    description: Audience this specific clip speaks to.
    example: Makeup lovers who want long-wear color without heavy texture
  hashtags:
    type: array
    items:
      type: string

  topComments:
    type: array
    items:
      $ref: ./CreativeComment.yaml

  relatedVideos:
    type: array
    description: Other TikTok videos for the same product (secondary slots; `index` 1+ on media routes).
    items:
      $ref: ./CreativeSecondaryVideo.yaml

  productRating:
    type: number
    nullable: true
    description: Denormalized parent product star rating (0–5).
    example: 4.6
  productTotalSales:
    type: integer
    nullable: true
  productTotalGmv:
    type: number
    nullable: true
    description: Parent product lifetime GMV (`price × units sold`). Not video-attributed.
  estimatedVideoGmv:
    type: number
    nullable: true
    description: |
      Estimated GMV attributed to this video by splitting parent `productTotalGmv` across
      creatives on the same SKU (view-share by default). Not TikTok-reported revenue.
  estimatedVideoSales:
    type: integer
    nullable: true
    description: Estimated units sold attributed to this video (same allocation as `estimatedVideoGmv`).
  estimatedVideoGmvShare:
    type: number
    nullable: true
    minimum: 0
    maximum: 1
    description: Fraction of parent product GMV allocated to this video (0–1).
  estimatedVideoGmvMethod:
    type: string
    nullable: true
    enum: [view_share, sole_video, equal_split, none]
    description: |
      Allocation method: `view_share` (multiple creatives, split by views),
      `sole_video` (only creative on SKU), `equal_split` (zero views fallback),
      `none` (no product GMV to allocate).
  estimatedVideoGmvComputedAt:
    type: string
    format: date-time
    nullable: true
  productPrice:
    type: number
    nullable: true
  productUrl:
    type: string
    format: uri
    nullable: true
  shopName:
    type: string
    nullable: true
  shopAvatarUrl:
    type: string
    format: uri
    nullable: true
  productPrimaryImageUrl:
    type: string
    format: uri
    nullable: true
  productSalesTrend:
    nullable: true
    description: Denormalized copy of the parent product's `salesTrend` (rolling sales windows).
    allOf:
      - $ref: ./MetricTrend.yaml#/MetricTrend
  productRevenueTrend:
    nullable: true
    description: Denormalized copy of the parent product's `revenueTrend` (rolling GMV windows).
    allOf:
      - $ref: ./MetricTrend.yaml#/MetricTrend
  productTrend:
    $ref: ./CreativeProductTrend.yaml

  publishedAt:
    type: string
    format: date-time
    nullable: true
  ingestedAt:
    type: string
    format: date-time
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
