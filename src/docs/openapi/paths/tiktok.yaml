# ── TikTok Live ───────────────────────────────────────────────────────────────
#
# Access levels:
#   User (JWT)  → GET /tiktok/live/discover, POST /tiktok/live/reconcile, POST /tiktok/live/watchlist
#   Admin only  → POST /tiktok/live/ingest-discovery, all /tiktok/stores/*, /tiktok/sessions/*, /tiktok/live,
#                 /tiktok/live/batch, /tiktok/live/products
#
# ─────────────────────────────────────────────────────────────────────────────

liveDiscover:
  get:
    tags: [TikTok Live]
    summary: List live sessions from database
    description: |
      Returns **`LiveSession`** documents with `status: 'live'` from MongoDB. Only sessions with **at least 2 concurrent viewers** (latest poll or peak) appear in **`sessions`** / **`live`** / **`liveCount`**.

      Read-only: **no** ScrapeCreators call. To re-verify open sessions and end rows that are no longer live, use **`POST /api/v1/tiktok/live/reconcile`**.

      **`data.live`** mirrors the legacy ScrapeCreators live-discover shape (same handles as `sessions`) so older clients keep working; prefer **`data.sessions`** for full documents. **`data.ended`** is always an empty array on this route.

      Data is also refreshed by a **background job** about **every hour** (`LiveMonitorService.discover()`): ScrapeCreators for **live status**; Apify shop scraper for product sold-count snapshots when sessions start/end.
      Use `watchlistLastCheckedAt` on the response as a freshness hint for when the watchlist was last synced.

      To force a full watchlist sync immediately (same code as the cron), call **`POST /api/v1/jobs/live-monitor-discover`**
      with `X-API-Key: INTERNAL_API_KEY`.
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Cached live sessions from DB
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        sessions:
                          type: array
                          description: LiveSession documents (status live)
                          items:
                            type: object
                        live:
                          type: array
                          description: Legacy-compatible list (same rows as sessions), shaped like ScrapeCreators live results. Card images use `room.coverUrl` and `user.avatarLarger` / `user.avatarMedium` / `user.avatarThumb`.
                          items:
                            $ref: '#/LiveResult'
                        ended:
                          type: array
                          description: Always empty on GET discover; use `POST /tiktok/live/reconcile` for ended handles
                          items:
                            type: string
                        liveCount:
                          type: integer
                          example: 2
                        totalChecked:
                          type: integer
                          description: Active watchlist size (same as totalActiveStores; legacy field name)
                        totalActiveStores:
                          type: integer
                          description: Count of active tracked stores on the watchlist
                          example: 104
                        watchlistLastCheckedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: Max `lastCheckedAt` among active tracked stores after last successful sync job

liveReconcile:
  post:
    tags: [TikTok Live]
    summary: Reconcile open live sessions with ScrapeCreators
    description: |
      Re-verifies each open **`LiveSession`** via ScrapeCreators (same logic as the hourly live monitor) and **ends** rows the API reports as no longer live.

      **`data.ended`** lists handles closed in this request (empty if none).

      Requires **`SCRAPECREATORS_API_KEY`**. Returns **503** with code **`SCRAPECREATORS_NOT_CONFIGURED`** when it is not set.
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Reconciliation finished
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [ended]
                      properties:
                        ended:
                          type: array
                          description: Handles whose live session was ended in this request
                          items:
                            type: string
      '503':
        description: ScrapeCreators API key not configured

liveIngestDiscovery:
  post:
    tags: [TikTok Live (Admin)]
    summary: Ingest live rooms from Apify keyword search into MongoDB
    description: |
      Runs the Apify **TikTok live scraper** for **`keyword`**, upserts each creator into **`TrackedStore`**,
      and starts or polls **`LiveSession`** when concurrent viewers are **≥ 2** (same threshold as discover).
      New sessions use **fastStart** (shop product baselines are filled on the next full `LiveMonitorService.discover()` run).

      Requires **`APIFY_API_TOKEN`**. When **`SCRAPECREATORS_API_KEY`** is set, new stores are enriched from the profile API.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [keyword]
            properties:
              keyword:
                type: string
                description: Search term for the live discovery actor
                example: skincare
              maxItems:
                type: integer
                minimum: 1
                maximum: 50
                default: 20
                description: Max live rooms to take from the actor (server caps at 50)
    responses:
      '200':
        description: Ingest finished — counts in `data`
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        keyword: { type: string }
                        apifyItemCount: { type: integer }
                        handlesProcessed: { type: integer }
                        storesCreated: { type: integer }
                        storesExisting: { type: integer }
                        sessionsStarted: { type: integer }
                        sessionsPolled: { type: integer }
                        skippedNoHandle: { type: integer }
                        skippedNoRoomId: { type: integer }
                        skippedLowViewers: { type: integer }
      '500':
        description: APIFY_API_TOKEN missing or Apify failure

liveWatchlist:
  post:
    tags: [TikTok Live]
    summary: Add a TikTok handle to the live watchlist
    description: |
      Adds a shop handle to the shared **TrackedStore** watchlist used by the live monitor job and `GET /tiktok/live/discover`.
      Same request body and behaviour as **admin** `POST /tiktok/stores` (profile enrichment when `SCRAPECREATORS_API_KEY` is set).
      Any authenticated user may call this route; listing or removing stores remains under admin routes.

      After a successful body validation, the server runs a **one-handle live probe** (same source as the hourly job) when `SCRAPECREATORS_API_KEY` is set. A **`LiveSession`** is started only if the API reports live **and** at least **2** concurrent viewers, so **`GET /tiktok/live/discover`** can show the stream without waiting for the cron.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [handle]
            properties:
              handle:
                type: string
                description: TikTok handle — @ prefix stripped automatically
                example: gymshark
              displayName: { type: string }
              notes: { type: string }
              tags:
                type: array
                items: { type: string }
              shopUrl:
                type: string
                format: uri
    responses:
      '201':
        description: Store added to watchlist
      '200':
        description: Handle already on watchlist — existing document returned
      '401':
        $ref: '../components/schemas/Common.yaml#/UnauthorizedError'

# ── Admin-only: Tracked stores (collection) ───────────────────────────────────

stores:
  get:
    tags: [TikTok Live (Admin)]
    summary: List tracked stores
    description: Returns all stores in the watchlist sorted by last live date.
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Array of TrackedStore documents
  post:
    tags: [TikTok Live (Admin)]
    summary: Add a store to the watchlist
    description: |
      Adds a TikTok handle to the tracked stores watchlist.
      If `SCRAPECREATORS_API_KEY` is configured the store is automatically
      enriched with profile data (avatar, bio, follower count, shop flags, etc.)
      from `/v1/tiktok/profile`. If the handle already exists, returns the
      existing document.

      **Any signed-in user** can add handles via **`POST /api/v1/tiktok/live/watchlist`** (same body); this admin route is for operators managing the full list.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [handle]
            properties:
              handle:
                type: string
                description: TikTok handle — @ prefix stripped automatically
                example: gymshark
              displayName: { type: string, example: Gymshark }
              notes:       { type: string }
              tags:
                type: array
                items: { type: string }
              shopUrl:
                type: string
                format: uri
    responses:
      '201':
        description: Store added
      '200':
        description: Handle already in watchlist — existing document returned

# ── Admin-only: Tracked stores (single item) ─────────────────────────────────

storeItem:
  get:
    tags: [TikTok Live (Admin)]
    summary: Store detail + recent sessions
    security:
      - BearerAuth: []
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string, example: gymshark } }
    responses:
      '200':
        description: Store document and up to 20 recent live sessions
      '404':
        description: Store not in watchlist
  patch:
    tags: [TikTok Live (Admin)]
    summary: Update store metadata
    description: Update notes, tags, shopUrl, or pause/resume monitoring via `isActive`.
    security:
      - BearerAuth: []
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              displayName: { type: string }
              notes:       { type: string }
              tags:
                type: array
                items: { type: string }
              shopUrl:
                type: string
                format: uri
                nullable: true
              isActive:
                type: boolean
                description: false = paused (excluded from the discover cycle)
    responses:
      '200':
        description: Updated store
      '404':
        description: Store not in watchlist
  delete:
    tags: [TikTok Live (Admin)]
    summary: Remove a store from the watchlist
    security:
      - BearerAuth: []
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: Store removed
      '404':
        description: Store not in watchlist

# ── Admin-only: Refresh store profile ────────────────────────────────────────

storeRefresh:
  post:
    tags: [TikTok Live (Admin)]
    summary: Re-fetch store profile from ScrapeCreators
    description: |
      Pulls fresh profile data (avatar, bio, follower count, shop flags, etc.)
      from `/v1/tiktok/profile` and updates the store document.
      Requires `SCRAPECREATORS_API_KEY`.
    security:
      - BearerAuth: []
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: Updated store (unchanged if profile returned no data)
      '404':
        description: Store not in watchlist
      '503':
        description: SCRAPECREATORS_API_KEY is not configured

# ── Admin-only: One-off live checks ──────────────────────────────────────────

liveSingle:
  get:
    tags: [TikTok Live (Admin)]
    summary: Check a single handle (ad-hoc, not tied to watchlist)
    security:
      - BearerAuth: []
    parameters:
      - { name: handle, in: query, required: true, schema: { type: string, example: gymshark } }
    responses:
      '200':
        description: Live status for the handle
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/LiveResult'

liveBatch:
  get:
    tags: [TikTok Live (Admin)]
    summary: Check up to 10 handles at once
    security:
      - BearerAuth: []
    parameters:
      - name: handles
        in: query
        required: true
        description: Comma-separated list of handles (max 10)
        schema: { type: string, example: "gymshark,fashionnova,skims" }
    responses:
      '200':
        description: Batch live status
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        live:
                          type: array
                          items:
                            $ref: '#/LiveResult'
                        liveCount:  { type: integer }
                        totalChecked: { type: integer }
      '400':
        description: No handles provided or more than 10 supplied

liveProducts:
  get:
    tags: [TikTok Live (Admin)]
    summary: Fetch products pinned to a live room
    description: |
      Fetches the product shelf for an active live room via TikTok's internal
      webcast API. Provide `roomId` directly, or `handle` to resolve it via a
      live check first.

      **Note:** TikTok's webcast API requires an `X-Bogus` request signature —
      without it responses return `status_code: 10013`. Results may be limited
      or unavailable depending on region.
    security:
      - BearerAuth: []
    parameters:
      - { name: roomId, in: query, schema: { type: string, example: "7412345678901234567" } }
      - { name: handle, in: query, schema: { type: string, example: gymshark } }
    responses:
      '200':
        description: Products in the live room (may be empty if unavailable)
      '400':
        description: Neither roomId nor handle provided

# ── Admin-only: Sessions ──────────────────────────────────────────────────────

sessions:
  get:
    tags: [TikTok Live (Admin)]
    summary: List live sessions (GMV history)
    description: |
      Paginated list of all recorded live sessions.
      Each session includes product snapshots with `soldDelta` and
      `estimatedRevenue` per product, plus the session-level `estimatedGMV`.
    security:
      - BearerAuth: []
    parameters:
      - { name: handle, in: query, schema: { type: string } }
      - { name: status, in: query, schema: { type: string, enum: [live, ended] } }
      - { name: page, in: query, schema: { type: integer, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
    responses:
      '200':
        description: Paginated session list with pagination metadata

sessionItem:
  get:
    tags: [TikTok Live (Admin)]
    summary: Single session detail
    security:
      - BearerAuth: []
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: Full session document including product snapshot breakdown
      '404':
        description: Session not found

# ── Shared schema ─────────────────────────────────────────────────────────────

LiveResult:
  type: object
  properties:
    handle:     { type: string, example: gymshark }
    isLive:     { type: boolean }
    roomId:     { type: string, example: "7412345678901234567" }
    watchUrl:   { type: string, format: uri, example: "https://www.tiktok.com/@gymshark/live" }
    user:
      type: object
      properties:
        uniqueId:       { type: string }
        nickname:       { type: string }
        avatarThumb:    { type: string, format: uri }
        avatarMedium:   { type: string, format: uri }
        avatarLarger:   { type: string, format: uri }
        verified:       { type: boolean }
        followerCount:  { type: integer }
        followingCount: { type: integer }
        signature:      { type: string }
    room:
      type: object
      properties:
        id:       { type: string }
        title:    { type: string }
        coverUrl: { type: string, format: uri }
        startTime: { type: integer }
        status:   { type: integer }
        liveRoomStats:
          type: object
          properties:
            userCount:  { type: integer, description: Current viewer count }
            enterCount: { type: integer, description: Total unique joins }
    streams:
      type: object
      properties:
        flv:  { type: string, format: uri }
        hls:  { type: string, format: uri }
        cmaf: { type: string, format: uri }
