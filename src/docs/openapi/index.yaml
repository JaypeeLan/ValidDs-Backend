openapi: 3.0.3
info:
  title: ValidDs Backend API
  description: |
    API documentation for ValidDs — TikTok product research and validation platform.

    All endpoints are prefixed with `/api/v1` except for health checks.

    ### Authentication
    - **API Key**: Required for internal/service-to-service communication.
    - **JWT**: Required for account-specific routes (auth, profile, saved products, **stores/Shopify**, ingestion). Product and creative **list/detail/search** are public unless noted on the operation.

    **Admin & ops** (`/api/v1/admin/*`, `/jobs/*`, TikTok operator routes) → **`/admin-docs`** only.

    ### Quick reference
    - **Categories** — `GET /products/categories`, `GET /products/subcategories`
    - **Personalization** — `GET /products/for-you` (JWT), `GET /products/{id}/you-may-like` (optional JWT)
    - **Compare** — `GET /products/compare?ids=id1,id2` (2–5 product IDs)
    - **Region** — `GET /profile/content-region`, `PATCH /profile/content-region`
  version: 1.0.0
  contact:
    name: ValidDs Support
    url: https://validds.com/support

servers:
  - url: https://validds-backend-g196.onrender.com
    description: Staging API on Render (default)
  - url: /
    description: Current host (same origin as /docs)
  - url: http://localhost:4000
    description: Local development (match PORT in .env)

tags:
  - name: Categories
    description: Fetch category and subcategory lists (no products)
  - name: Region
    description: Get or update the user's content region / market (JWT)
  - name: Health
    description: System status and uptime checks
  - name: Auth
    description: User registration, login, email verification, and session management
  - name: Profile
    description: User profile and saved products (bookmarks)
  - name: Products
    description: Product feed and detail
  - name: Creatives
    description: TikTok creatives — list, top ads, detail, CDN video/thumbnail proxy, and embed URLs
  - name: Billing
    description: Stripe billing — public plan catalog, Checkout session creation, subscription state, and publishable key
  - name: Waitlist
    description: Pre-launch email waitlist — public `POST /api/v1/waitlist` to join
  - name: Stores
    description: Shopify OAuth — connect a merchant store and push ValidDs products via Admin REST
  - name: TikTok Live
    description: Live sessions from MongoDB — `GET /tiktok/live/discover`, `POST /tiktok/live/reconcile` (JWT)

