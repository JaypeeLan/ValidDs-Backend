feed:
  get:
    tags: [Products]
    summary: List products (paginated)
    description: |
      Returns active products with default pagination (`page`, `limit`).
      With no filters, this is the full catalog, one page at a time.
      Pass `q` to run full-text search on the same endpoint (results ordered by relevance; `sortBy` is ignored when `q` is set).
    parameters:
      - name: q
        in: query
        required: false
        description: Full-text search query (optional).
        schema: { type: string, maxLength: 200 }
      - name: page
        in: query
        schema: { type: integer, default: 1, minimum: 1 }
      - name: limit
        in: query
        schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      - name: category
        in: query
        description: Filter by category. Pass multiple times or as comma-separated string for multi-select.
        schema: 
          type: array
          items:
            type: string
      - name: trendDirection
        in: query
        schema: { type: string, enum: [rising, peaked, saturating, unknown] }
      - name: minTrendScore
        in: query
        schema: { type: number }
      - name: minViews
        in: query
        schema: { type: number }
      - name: isAd
        in: query
        schema: { type: boolean }
      - name: sortBy
        in: query
        description: Ignored when `q` is present.
        schema: { type: string, enum: [trendScore, views, recent, engagement], default: trendScore }
      - name: region
        in: query
        schema: { type: string }
    responses:
      '200':
        description: List of products retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        products:
                          type: array
                          items:
                            $ref: '../components/schemas/Product.yaml'
                        pagination:
                          type: object
                        freshness:
                          type: object
                        region:
                          type: string

keywordContext:
  get:
    tags: [Products]
    summary: Search TikTok keyword context from EnsembleData
    parameters:
      - name: name
        in: query
        required: true
        schema: { type: string }
      - name: timeFilter
        in: query
        schema: { type: integer, enum: [1, 7, 30, 90, 180], default: 30 }
      - name: sortOrder
        in: query
        schema: { type: integer, enum: [0, 1], default: 0 }
      - name: country
        in: query
        schema: { type: string, example: us }
      - name: cursor
        in: query
        schema: { type: integer, default: 0 }
      - name: matchExactly
        in: query
        schema: { type: boolean, default: false }
    responses:
      '200':
        description: Keyword context retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        keyword: { type: string }
                        filters:
                          type: object
                          properties:
                            timeFilter: { type: integer, enum: [1, 7, 30, 90, 180] }
                            sortOrder: { type: integer, enum: [0, 1] }
                            country: { type: string }
                            matchExactly: { type: boolean }
                        pagination:
                          type: object
                          properties:
                            cursor: { type: integer }
                            nextCursor: { type: integer, nullable: true }
                        suggestedHashtags:
                          type: array
                          items: { type: string }
                        posts:
                          type: array
                          items:
                            type: object
                            properties:
                              videoId: { type: string }
                              videoUrl: { type: string }
                              videoPlayUrl: { type: string }
                              creatorHandle: { type: string }
                              creatorDisplayName: { type: string }
                              creatorFollowers: { type: integer }
                              creatorRegion: { type: string }

detail:
  get:
    tags: [Products]
    summary: Get product by ID
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Product details retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        product: { $ref: '../components/schemas/Product.yaml' }
      '404':
        $ref: '../components/responses/Standard.yaml#/NotFoundResponse'

categories:
  get:
    tags: [Products]
    summary: Get all unique categories
    description: Returns a list of all active unique product categories.
    responses:
      '200':
        description: Categories retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/Common.yaml#/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        categories:
                          type: array
                          items:
                            type: string
