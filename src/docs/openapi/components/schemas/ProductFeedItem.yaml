type: object
description: Lean product shape for the discovery grid (`GET /products`). Use `Product` schema for detail.
required:
  - id
  - title
  - categoryL1
  - aiInsight
  - lastIngestedAt
properties:
  id:
    type: string
  title:
    type: string
  primaryImageUrl:
    type: string
    format: uri
    description: First image in `imageUrls` (card hero).
  imageUrls:
    type: array
    description: All product image URLs for the card/gallery (primary first, deduped).
    items:
      type: string
      format: uri
  price:
    type: number
  originalPrice:
    type: number
    nullable: true
    description: Strikethrough / was price on TikTok Shop when higher than `price`.
  currency:
    type: string
    example: USD
  categoryL1:
    type: string
    example: Fashion
  categoryPath:
    type: string
  rating:
    type: number
  ratings:
    type: number
  totalSales:
    type: number
    description: Units sold (all time).
  totalGmv:
    type: number
    description: Gross merchandise value (all time).
  salesTrend:
    allOf:
      - $ref: ./MetricTrend.yaml#/MetricTrend
    nullable: true
    description: Sales sparkline (rolling windows, e.g. units sold).
  priceTrend:
    allOf:
      - $ref: ./MetricTrend.yaml#/MetricTrend
    nullable: true
    description: Price sparkline (monthly windows from Shopify finder / ingest).
  shopName:
    type: string
  shopUrl:
    type: string
    format: uri
    description: TikTok Shop / merchant storefront link.
  officialWebsiteUrl:
    type: string
    format: uri
    nullable: true
    description: Merchant's own DTC storefront when provably the same store as the TikTok shop.
  storeLinks:
    type: array
    description: Ready-to-render storefront links for the product card/detail UI.
    items:
      type: object
      required: [platform, label, url, kind]
      properties:
        platform:
          type: string
          enum: [tiktok, shopify]
        label:
          type: string
        url:
          type: string
          format: uri
        kind:
          type: string
          enum: [store, product]
  shopAvatarUrl:
    type: string
    format: uri
    nullable: true
  lastIngestedAt:
    type: string
    format: date-time
  isTopAd:
    type: boolean
  competitionScore:
    type: number
    nullable: true
    description: Max supplier `competitorScore` when available.
  aiInsight:
    type: object
    properties:
      confidence:
        type: object
        properties:
          score:
            type: number
            minimum: 0
            maximum: 100
      buyingSentiment:
        type: object
        properties:
          score:
            type: number
            minimum: 0
            maximum: 100
          label:
            type: string
            enum: [positive, neutral, negative]
  trend:
    type: object
    properties:
      score:
        type: number
      direction:
        type: string
      isTrending:
        type: boolean
  primaryCreator:
    type: object
    properties:
      handle: { type: string }
      primaryImageUrl: { type: string, format: uri, nullable: true }
      avatarUrl: { type: string, format: uri, nullable: true }
      avatarProxyUrl: { type: string }
