type: object
required:
  - id
  - externalId
  - source
  - status
  - title
  - normalizedTitle
  - categoryL1
  - categoryPath
  - primaryCreator
  - aiIntelligence
  - trend
properties:
  id:
    type: string
  externalId:
    type: string
  source:
    type: string
  status:
    type: string
    enum: [active, archived, stale]
  title:
    type: string
  normalizedTitle:
    type: string
  description:
    type: string
  hashtags:
    type: array
    items:
      type: string
  categoryL1:
    type: string
  categoryL2:
    type: string
  categoryL3:
    type: string
  categoryPath:
    type: string
  primaryImageUrl:
    type: string
    format: uri
  imageUrls:
    type: array
    items:
      type: string
      format: uri
  price:
    type: number
  currency:
    type: string
  suppliers:
    type: array
    items:
      type: object
      properties:
        platform:
          type: string
        productUrl:
          type: string
          format: uri
        price:
          type: number
        currency:
          type: string
        shippingDays:
          type: integer
        moq:
          type: integer
        checkedAt:
          type: string
          format: date-time
  salesEvidence:
    type: object
    properties:
      unitsSold:
        type: integer
      store:
        type: string
      storeUrl:
        type: string
        format: uri
      timeframe:
        type: string
      fetchedAt:
        type: string
        format: date-time
  ratingSources:
    type: array
    items:
      type: object
      properties:
        platform:
          type: string
        rating:
          type: number
        reviewCount:
          type: integer
        sourceUrl:
          type: string
          format: uri
        fetchedAt:
          type: string
          format: date-time
  topComments:
    type: array
    items:
      type: object
      properties:
        text:
          type: string
        likeCount:
          type: integer
        authorHandle:
          type: string
        sentiment:
          type: string
          enum: [positive, negative, neutral]
        source:
          type: string
        collectedAt:
          type: string
          format: date-time
  viewCount:
    type: integer
  likeCount:
    type: integer
  commentCount:
    type: integer
  shareCount:
    type: integer
  engagementRate:
    type: number
  rating:
    type: number
    description: "Weighted average rating from all sources (1-5)"
  reviewCount:
    type: integer
    description: "Total number of reviews across all sources"
  primaryCreator:
    type: object
    properties:
      tiktokUserId:
        type: string
      handle:
        type: string
      displayName:
        type: string
      bio:
        type: string
      followers:
        type: integer
      following:
        type: integer
      totalLikes:
        type: integer
      region:
        type: string
      verified:
        type: boolean
      avatarUrl:
        type: string
        format: uri
      tiktokPostUrl:
        type: string
        format: uri
  aiIntelligence:
    type: object
    properties:
      confidence:
        type: number
      confidenceReason:
        type: string
      buyingSentimentScore:
        type: number
      buyingSentimentReason:
        type: string
      extractedAt:
        type: string
        format: date-time
  trend:
    type: object
    properties:
      score:
        type: number
      direction:
        type: string
      reason:
        type: string
      isTrending:
        type: boolean
      calculatedAt:
        type: string
        format: date-time
  discoverySections:
    type: array
    items:
      type: string
  isTopAd:
    type: boolean
    description: |
      Present on API list/detail responses: `true` when `discoverySections` contains the slug `top-ads`.
      Use query `section=top-ads` or `isAd=true` to list only these products.
  relatedProducts:
    type: array
    items:
      type: object
      properties:
        title:
          type: string
        price:
          type: string
        thumbnail:
          type: string
          format: uri
        link:
          type: string
          format: uri
        store:
          type: string
  creativeCounts:
    type: object
    properties:
      ads:
        type: integer
      organic:
        type: integer
      reviews:
        type: integer
      total:
        type: integer
  lastIngestedAt:
    type: string
    format: date-time
  dataSourceUpdatedAt:
    type: string
    format: date-time
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
