openapi: 3.0.3
info:
  title: ValidDs Backend API
  description: |
    API documentation for ValidDs — TikTok product research and validation platform.
    
    All endpoints are prefixed with `/api/v1` except for health checks.
    
    ### Authentication
    - **API Key**: Required for internal/service-to-service communication.
    - **JWT**: Required for account-specific routes (auth, profile, saved products, ingestion, admin). Product and creative **list/detail/search** are public unless noted on the operation.
  version: 1.0.0
  contact:
    name: ValidDs Support
    url: https://validds.com/support

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://validds-backend-g196.onrender.com
    description: Staging environment

tags:
  - name: Health
    description: System status and uptime checks
  - name: Auth
    description: User registration, login, email verification, and session management
  - name: Products
    description: Product list (paginated, optional search and filters) and product details
  - name: Profile
    description: User settings and account management
  - name: Ingestion
    description: Background jobs using DeepSeek and EnsembleData.
  - name: Admin
    description: System health and analytics for users, products, and TikTok creatives.
  - name: Billing
    description: Stripe billing — public plan catalog, Checkout session creation, subscription state, and publishable key
  - name: Waitlist
    description: Pre-launch email waitlist — public `POST /api/v1/waitlist` to join, admin-only `GET /api/v1/admin/waitlist` to list

paths:
  /health:
    $ref: './paths/health.yaml'
  /api/v1/auth/register:
    $ref: './paths/auth.yaml#/register'
  /api/v1/auth/login:
    $ref: './paths/auth.yaml#/login'
  /api/v1/auth/email/send-code:
